<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eaf0fc">
  <meta name="description" content="Aster: an independent, local-first browser desktop with WebGPU graphics and working apps.">
  <title>Aster Desktop</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body data-theme="light">
  <canvas id="compositor" aria-hidden="true"></canvas>
  <div id="brightness" aria-hidden="true"></div>
  <main id="desktop" aria-label="Desktop"><div id="desktop-icons" role="group" aria-label="Desktop shortcuts"></div></main>
  <div id="window-layer" aria-label="Application windows"></div>
  <div id="snap-preview" hidden></div>
  <div id="panel-layer"></div>
  <div id="toast-layer" aria-live="polite"></div>
  <div id="context-menu" class="flyout context-menu" role="menu" hidden></div>
  <div id="dialog-layer"></div>
  <nav id="taskbar" aria-label="Taskbar"></nav>
  <div id="boot"><div class="aster-symbol"></div><strong>Aster</strong><span class="boot-spinner"></span><small>Your space. Your pace.</small></div>
  <noscript>Aster requires JavaScript. All built-in apps run locally in your browser.</noscript>
  <script src="src/core.js"></script>
  <script src="src/renderer.js"></script>
  <script src="src/windows.js"></script>
  <script src="src/apps-files.js"></script>
  <script src="src/apps-creative.js"></script>
  <script src="src/apps-tools.js"></script>
  <script src="src/apps-system.js"></script>
  <script src="src/win32/gdi.js"></script>
  <script src="src/apps-win32.js"></script>
  <script src="src/shell.js"></script>
</body>
</html>
