name: Preserve browser Win32 failure diagnostics
on:
  push:
    branches: [feat/browser-win32]
    paths: ['.github/workflows/win32-fault-order.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Apply guarded error-ordering and diagnostic-state fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changes={}
          def replace(path,old,new):
              text=changes.get(path,Path(path).read_text())
              assert text.count(old)==1,(path,text.count(old))
              changes[path]=text.replace(old,new)
          replace('src/win32/worker.js',"function crash(error){releaseCredits();savedFiles();process?.exit(1);postMessage({type:'error',message:String(error.message||error),stats:process?.stats()});}","""function crash(error){
              releaseCredits();savedFiles();
              // Preserve the failure diagnostic before exit handling schedules Stop.
              // Otherwise the main thread may mark the session halted and suppress it.
              postMessage({type:'error',message:String(error.message||error),stats:process?.stats()});
              process?.exit(1);
          }""")
          replace('src/apps-win32.js',"else if(e.type==='error')this.error(Error(e.message));","else if(e.type==='error'){this.stats=e.stats||this.stats;this.error(Error(e.message));}")
          replace('tests/win32/unit.cjs',"await check('Path traversal, UNC, device and alternate-drive paths are denied'","""await check('Worker publishes a real loader failure before its exit notification',async()=>{
           const vm=require('node:vm'),events=[],bad=Uint8Array.from(exe('hello'));
           const at=Buffer.from(bad).indexOf(Buffer.from('MessageBoxW'));assert(at>0);bad.set(Buffer.from('MissingCall'),at);
           const sandbox={AsterWin32:{Runtime},Uint8Array,postMessage:e=>events.push(e),setInterval:()=>0,onmessage:null};
           vm.createContext(sandbox);vm.runInContext(fs.readFileSync(root+'/src/win32/worker.js','utf8'),sandbox);
           await sandbox.onmessage({data:{type:'start',wasm:moduleCache,exe:bad.buffer,name:'invalid.exe',files:[]}});
           const error=events.findIndex(e=>e.type==='error'),exit=events.findIndex(e=>e.type==='exit');
           assert(error>=0);assert(exit>error);assert.match(events[error].message,/MissingCall/);assert.equal(events[error].stats.instructions,0);
           return {order:events.map(e=>e.type),executedInstructions:0};
          });
          await check('Path traversal, UNC, device and alternate-drive paths are denied'""")
          for path,text in changes.items():Path(path).write_text(text)
          PY
      - name: Verify loader errors, CPU behavior and render backpressure
        run: |
          node --check src/apps-win32.js
          node --check src/win32/worker.js
          node tests/win32/unit.cjs
          node tests/win32/backpressure.cjs
          python3 build.py
      - name: Commit source and remove the completed temporary workflow
        run: |
          rm .github/workflows/win32-fault-order.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/apps-win32.js src/win32/worker.js tests/win32/unit.cjs Aster.html
          git add -u .github/workflows
          git commit -m 'Report Win32 faults before normal exit handling and retain CPU diagnostics'
          git push origin HEAD:feat/browser-win32
