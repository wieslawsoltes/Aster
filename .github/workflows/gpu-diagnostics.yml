name: Isolated GDI WebGPU diagnostics
on:
  push:
    branches: [feat/browser-win32]
    paths: ['.github/workflows/gpu-diagnostics.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: |
          python3 -m pip install playwright
          python3 -m playwright install chromium
      - name: Execute the actual GDI renderer without the desktop compositor
        env:
          DEBUG: pw:browser
        run: |
          python3 - <<'PY'
          import threading, json
          from pathlib import Path
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          from playwright.sync_api import sync_playwright
          server = ThreadingHTTPServer(('127.0.0.1',0), SimpleHTTPRequestHandler)
          threading.Thread(target=server.serve_forever,daemon=True).start()
          with sync_playwright() as p:
              b = p.chromium.launch(headless=True,args=['--no-sandbox','--enable-unsafe-webgpu','--use-webgpu-adapter=swiftshader','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
              page = b.new_page()
              page.on('console',lambda m: print('CONSOLE',m.type,m.text,flush=True))
              page.on('pageerror',lambda e: print('PAGEERROR',str(e),flush=True))
              page.goto('http://127.0.0.1:'+str(server.server_port)+'/')
              page.evaluate('document.body.replaceChildren()')
              page.add_script_tag(path='src/win32/gdi.js')
              result = page.evaluate('''async()=>{
                  const g = new AsterGDI(document.body,64,64,{requireGPU:true,onError:e=>console.error('GDI ERROR',e.message)});
                  try {
                      await g.init();
                      console.log('ADAPTER',JSON.stringify(g.adapter.info));
                      g.enqueue([{op:'rect',x:0,y:0,w:64,h:64,color:[12,34,56,255]}]);
                      const pixel=await g.pixel(10,10);
                      return {pixel,stats:g.stats()};
                  } catch(e) {return {error:String(e),stats:g.stats()};}
                  finally {g.destroy();}
              }''')
              print(json.dumps(result,indent=2),flush=True)
              assert result.get('pixel') == [12,34,56,255], result
              b.close()
          server.shutdown()
          PY
