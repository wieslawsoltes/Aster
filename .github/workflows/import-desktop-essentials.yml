name: Import tested desktop essentials source
on:
  push:
    branches: [feat/desktop-essentials]
    paths: ['.bootstrap/essentials/ready', '.github/workflows/import-desktop-essentials.yml']
permissions:
  contents: write
concurrency:
  group: import-desktop-essentials
  cancel-in-progress: false
jobs:
  import:
    if: github.event.head_commit.message == 'Apply complete desktop essentials source'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify every source input and expand the bounded delta
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, json, lzma
          folder=Path('.bootstrap/essentials')
          m=json.loads((folder/'manifest.json').read_text())
          assert m['parts']==9 and m['rawBytes']==155077 and m['encodedBytes']==59312
          assert m['rawSHA256']=='c7eddaefe05f5d8fbae35e8ad6def80ffae455d13907e4db4e2ad65b78e7bc7b'
          assert m['archiveSHA256']=='e3fb382635be2a4e509d1d4bf654f8f47bbaa38fc2ffe71d4f5d513e6d22bd79'
          encoded=''.join((folder/f'part-{i:02}.b64').read_text().strip() for i in range(m['parts']))
          assert len(encoded)==m['encodedBytes'], 'Encoded length mismatch'
          compressed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(compressed).hexdigest()==m['archiveSHA256'], 'Archive checksum mismatch'
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=decoder.decompress(compressed,max_length=m['rawBytes']+1)
          assert decoder.eof and not decoder.unused_data and len(raw)==m['rawBytes']
          assert hashlib.sha256(raw).hexdigest()==m['rawSHA256']
          changes=json.loads(raw)
          allowed={'.github/workflows/desktop-essentials.yml','.gitignore','README.md','docs/desktop-essentials.md','index.html','src/apps-accessibility.js','src/apps-creative.js','src/apps-desktop.js','src/apps-files.js','src/apps-recorder.js','src/apps-system.js','src/apps-tools.js','src/archives.js','src/core.js','src/desktop-models.js','src/desktop-services.js','src/renderer.js','src/shell.js','src/styles.css','src/windows.js','sw.js','tests/desktop-features/README.md','tests/desktop-features/browser.py','tests/desktop-features/models.cjs','tests/smoke.py'}
          assert len(changes)==25 and {c['path'] for c in changes}==allowed==set(m['paths'])
          outputs=[]
          for c in changes:
              path=PurePosixPath(c['path'])
              assert not path.is_absolute() and '..' not in path.parts
              p=Path(path)
              assert not p.is_symlink()
              if c['before'] is None:
                  assert not p.exists(), 'New path already exists: '+str(p)
                  data=c['content'].encode('utf-8')
              else:
                  before=p.read_bytes()
                  assert hashlib.sha256(before).hexdigest()==c['before'], 'Concurrent source modification: '+str(p)
                  text=before.decode('utf-8'); last=0
                  for a,b,value in c['ops']:
                      assert last<=a<=b<=len(text) and isinstance(value,str)
                      last=b
                  for a,b,value in reversed(c['ops']): text=text[:a]+value+text[b:]
                  data=text.encode('utf-8')
              assert hashlib.sha256(data).hexdigest()==c['after'], 'Result checksum: '+str(p)
              outputs.append((p,data))
          for p,data in outputs:
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          print('Verified and imported',len(outputs),'editable source files.')
          PY
      - name: Validate sources, models and inherited executable compatibility
        run: |
          for f in src/*.js src/win32/*.js sw.js; do node --check "$f"; done
          python3 -m py_compile build.py tests/desktop-features/browser.py tests/smoke.py
          node --test tests/desktop-features/models.cjs tests/web-apps/catalog.cjs
          node tests/win32/unit.cjs
          node tests/win32/compat.cjs
          node tests/win32/gui.cjs
          node tests/win32/backpressure.cjs
          python3 build.py
          git restore tests/results.json
          git diff --check
      - name: Commit editable source and remove temporary import material
        run: |
          rm -rf .bootstrap/essentials
          rm .github/workflows/import-desktop-essentials.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Implement ten Windows-inspired desktop essentials with transactional files and browser tests'
          git push origin HEAD:feat/desktop-essentials
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-import-diagnostics
          path: tests/win32/artifacts/
          retention-days: 7
