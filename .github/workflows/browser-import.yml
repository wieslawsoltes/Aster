name: Import browser Win32 implementation

on:
  push:
    branches: [feat/browser-win32]
    paths: ['.browser-import/ready']

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify source payload and unchanged base files
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, io, json, lzma, shutil, subprocess, tarfile
          root = Path.cwd()
          folder = root / '.browser-import'
          manifest = json.loads((folder / 'manifest.json').read_text())
          encoded = ''.join((folder / f'part-{i:02d}.b64').read_text().strip() for i in range(manifest['parts']))
          archive = base64.b64decode(encoded, validate=True)
          assert len(archive) == manifest['bytes'], 'Source length mismatch'
          assert hashlib.sha256(archive).hexdigest() == manifest['archive_sha256'], 'Source checksum mismatch'
          for name, expected in manifest['before'].items():
              actual = subprocess.check_output(['git', 'hash-object', name], text=True).strip()
              assert actual == expected, f'Base file changed: {name}'
          with tarfile.open(fileobj=io.BytesIO(lzma.decompress(archive)), mode='r:') as tar:
              members = tar.getmembers()
              assert len(members) == len(manifest['files'])
              assert {m.name for m in members} == set(manifest['files'])
              for member in members:
                  path = PurePosixPath(member.name)
                  assert member.isfile() and not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] not in ('.git', '.github', '.browser-import')
                  data = tar.extractfile(member).read()
                  assert hashlib.sha256(data).hexdigest() == manifest['files'][member.name], member.name
                  destination = root / member.name
                  assert destination.resolve().is_relative_to(root)
                  destination.parent.mkdir(parents=True, exist_ok=True)
                  destination.write_bytes(data)
                  destination.chmod(0o644)
          subprocess.run(['git', 'apply', '--check', 'changes.patch'], check=True)
          subprocess.run(['git', 'apply', 'changes.patch'], check=True)
          for name, expected in manifest['after'].items():
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected, name
          (root / 'changes.patch').unlink()
          shutil.rmtree(folder)
          print('Verified all source files and applied the browser-only implementation.')
          PY
      - name: Validate JavaScript and rebuild the complete offline HTML
        run: |
          for file in src/*.js src/win32/*.js sw.js; do node --check "$file"; done
          python3 build.py
      - name: Commit the actual editable source and generated offline build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Implement browser-only Win32 PE32 execution, Wasm x86 core and WebGPU GDI"
          git push origin HEAD:feat/browser-win32
