name: Recover staged picker source
on:
  push:
    branches: [feat/profile-file-pickers]
    paths: ['.github/workflows/recover-picker-source.yml']
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Preserve original bytes and bounded decompression
        run: |
          mkdir -p /tmp/picker-recovery
          git archive --format=zip HEAD -o /tmp/picker-recovery/source.zip
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, lzma
          parts=sorted(Path('.transfer').glob('picker-*.b64'))
          encoded=''.join(p.read_text().strip() for p in parts)
          data=base64.b64decode(encoded,validate=True)
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=decoder.decompress(data,max_length=2*1024*1024)
          Path('/tmp/picker-recovery/delta.partial').write_bytes(raw)
          report={'parts':[p.name for p in parts],'complete':decoder.eof,'compressedBytes':len(data),'decodedBytes':len(raw),'sha256':hashlib.sha256(data).hexdigest()}
          Path('/tmp/picker-recovery/report.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: picker-source-recovery
          path: /tmp/picker-recovery/
          retention-days: 14
