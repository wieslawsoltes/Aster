name: Complete staged theme source
on:
  push:
    branches: [feat/theme-system]
    paths: ['.github/workflows/complete-theme-source.yml']
permissions:
  contents: write
concurrency:
  group: complete-theme-source
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and expand only the previously staged source delta
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, json, lzma, re
          parts = sorted(Path('.transfer').glob('theme-*.b64'))
          assert [p.name for p in parts] == [f'theme-{i}.b64' for i in range(6)]
          encoded = ''.join(p.read_text().strip() for p in parts)
          assert len(encoded) < 1024 * 1024
          compressed = base64.b64decode(encoded, validate=True)
          decoder = lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw = decoder.decompress(compressed, max_length=2*1024*1024)
          assert decoder.eof and not decoder.unused_data
          changes = json.loads(raw)
          assert isinstance(changes, list) and 1 <= len(changes) <= 60
          assert len({c['path'] for c in changes}) == len(changes)
          root_files = {'.gitignore','README.md','TESTING.md','index.html','sw.js','build.py'}
          outputs = []
          for c in changes:
              name = c['path']; path = PurePosixPath(name); p = Path(name)
              assert not path.is_absolute() and '..' not in path.parts and not p.is_symlink(), name
              assert name in root_files or name.startswith(('src/','tests/','docs/')), name
              assert not any(part.startswith('.') for part in path.parts) or name == '.gitignore', name
              assert re.fullmatch('[0-9a-f]{64}', c['after']), name
              if c['before'] is None:
                  assert not p.exists(), 'Unexpected existing file: '+name
                  data = c['content'].encode('utf-8')
              else:
                  before = p.read_bytes()
                  assert hashlib.sha256(before).hexdigest() == c['before'], 'Changed base: '+name
                  text = before.decode('utf-8'); last = 0
                  for a,b,value in c['ops']:
                      assert isinstance(a,int) and isinstance(b,int) and last <= a <= b <= len(text) and isinstance(value,str)
                      last = b
                  for a,b,value in reversed(c['ops']):
                      text = text[:a]+value+text[b:]
                  data = text.encode('utf-8')
              assert hashlib.sha256(data).hexdigest() == c['after'], 'Bad output: '+name
              outputs.append((p,data))
          for p,data in outputs:
              p.parent.mkdir(parents=True,exist_ok=True); p.write_bytes(data)
          report = {'compressedSHA256':hashlib.sha256(compressed).hexdigest(),'deltaSHA256':hashlib.sha256(raw).hexdigest(),'files':[{'path':str(p),'bytes':len(d),'sha256':hashlib.sha256(d).hexdigest()} for p,d in outputs]}
          Path('/tmp/theme-recovery.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
      - name: Validate JavaScript, Python, models and standalone build
        run: |
          for f in src/*.js src/win32/*.js sw.js; do node --check "$f"; done
          python3 -m py_compile build.py tests/themes/*.py
          python3 build.py
          node --test tests/themes/models.cjs tests/themes/win32.cjs tests/shell-launch/models.cjs tests/file-workflows/models.cjs tests/integrated-shell/contracts.cjs tests/desktop-features/models.cjs tests/web-apps/catalog.cjs
          git diff --check
      - name: Commit recovered source on the existing PR branch
        run: |
          rm -rf .transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Integrate staged theme service, Windows format support and desktop shell profiles'
          git push origin HEAD:feat/theme-system
      - name: Preserve source for independent review
        if: always()
        run: |
          mkdir -p /tmp/theme-review
          cp /tmp/theme-recovery.json /tmp/theme-review/ 2>/dev/null || true
          tar --exclude=.git --exclude=.transfer -czf /tmp/theme-review/source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: theme-source-review
          path: /tmp/theme-review/
          retention-days: 14
