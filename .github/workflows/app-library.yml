name: App Center — installed apps, descriptions and local packages
on:
  pull_request:
    paths: ['src/**','tests/**','index.html','Aster.html','build.py','sw.js','.github/workflows/app-library.yml']
  push:
    branches: [main]
    paths: ['src/**','tests/app-library/**','index.html','Aster.html','sw.js','.github/workflows/app-library.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-library-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate actual source and reproducible standalone
        run: |
          for f in src/*.js sw.js; do node --check "$f"; done
          node --test tests/*/models.cjs tests/integrated-shell/contracts.cjs tests/web-apps/catalog.cjs
          python -m py_compile tests/app-library/browser.py
          python build.py
          git diff --exit-code -- Aster.html sdk/aster-files.js
          git diff --check
      - name: Install verification browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Real HTTP installation, editing, package updates and IndexedDB
        run: python tests/app-library/browser.py
      - name: Standalone, durable migration and offline library
        run: python tests/app-library/browser.py --standalone --output tests/app-library/artifacts/standalone
      - name: Preserve the exact source and standalone hashes
        if: always()
        run: |
          mkdir -p tests/app-library/artifacts
          git archive --format=zip HEAD -o tests/app-library/artifacts/source.zip
          git rev-parse HEAD > tests/app-library/artifacts/checkout.txt
          sha256sum Aster.html > tests/app-library/artifacts/standalone.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-library-chromium-evidence
          path: tests/app-library/artifacts/
          retention-days: 14
  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps firefox
      - name: Real App Center workflows in Firefox
        run: python tests/app-library/browser.py --engine firefox --output tests/app-library/artifacts/firefox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-library-firefox-evidence
          path: tests/app-library/artifacts/firefox/
          retention-days: 14
