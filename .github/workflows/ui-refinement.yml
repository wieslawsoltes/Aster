name: UI refinement — caption hits, original icons and window actions
on:
  pull_request:
    paths: ['src/**', 'tests/**', 'index.html', 'Aster.html', 'build.py', 'sw.js', '.github/workflows/ui-refinement.yml']
  push:
    branches: [main]
    paths: ['src/**', 'tests/ui-refinement/**', 'index.html', 'Aster.html', 'sw.js', '.github/workflows/ui-refinement.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-refinement-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate actual window methods, icon bounds and standalone reproducibility
        run: |
          for f in src/*.js src/win32/*.js sw.js; do node --check "$f"; done
          python -m py_compile build.py tests/ui-refinement/browser.py
          python build.py
          git diff --exit-code -- Aster.html
          node --test tests/ui-refinement/models.cjs tests/visual-materials/models.cjs
          git diff --check
      - name: Install test browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Real controls and all presets over HTTP with IndexedDB
        run: python tests/ui-refinement/browser.py
      - name: Repeat against standalone and offline startup
        run: python tests/ui-refinement/browser.py --standalone --output tests/ui-refinement/artifacts/standalone
      - name: Keep the exact tested source
        if: always()
        run: |
          mkdir -p tests/ui-refinement/artifacts
          git archive --format=zip HEAD -o tests/ui-refinement/artifacts/source.zip
          git rev-parse HEAD > tests/ui-refinement/artifacts/checkout.txt
          sha256sum Aster.html > tests/ui-refinement/artifacts/standalone.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-refinement-chromium-evidence
          path: |
            tests/ui-refinement/artifacts/
            Aster.html
          retention-days: 14
  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent browser engine
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps firefox
      - name: Real captions, icons, menus and persisted state using the Firefox fallback
        run: python tests/ui-refinement/browser.py --engine firefox --output tests/ui-refinement/artifacts/firefox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-refinement-firefox-evidence
          path: tests/ui-refinement/artifacts/firefox/
          retention-days: 14
