name: Complete native file clipboard repair
on:
  push:
    branches: [fix/clipboard-keyboard]
    paths: ['.github/workflows/complete-native-clipboard.yml']
permissions:
  contents: write
jobs:
  complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate every input and output before applying the reviewed source delta
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          changes=json.loads(r'''[{"path":"docs/clipboard.md","before":"b2df3c95d06be7070363841710ceda1bf661a72c7a3d11cf84415f6da5d32113","after":"22c9caec77e1d82541c29eb6dcee94fcb1a5f214ea7330aeffed6bad1895a023","ops":[[3584,3666,"so copying external text cannot accidentally paste stale Aster files. A portable,\nescaped HTML representation carries the same token for browsers that discard the\ncustom MIME type; readable plain path text is unchanged. Matching requires the\ncurrent token and exact path text, never path text alone, and the HTML is not\nparsed or executed. Document-body paste events are routed only to the live,\nfocused Files window; editable fields and open dialogs keep their native paste. Toolbar and\n"]]},{"path":"src/apps-files.js","before":"40c2c65b3f9b4f2ec6a8919b0adfbc3c66a1438d379525e044d521d343786531","after":"3986dcb73048b0f634bf5b2f53a8e4554d2e62093840dc4d00ed5357c978b8c6","ops":[[7606,8070,"                return; OS.clipboard = { paths: [...selected], cut, token:OS.uid() }; if(event?.clipboardData){OS.clipboardTools.writeFileReference(event,OS.clipboard);} else OS.clipboardTools.copyFileReference(OS.clipboard); OS.notify(cut ? 'Ready to move' : 'Copied', `${selected.size} item${selected.size === 1 ? '' : 's'} on the Aster clipboard.`); updateCommandState(); };\n"],[46146,46476,"            const fileClipboardEvent=e=>{\n                const target=OS.input.target(e),active=OS.input.deepActive();\n                // Firefox targets native Paste at BODY for a non-editable file\n                // list. Only the focused, live Files owner may receive it.\n                const bodyTarget=e.isTrusted&&(target===document.body||target===document.documentElement)&&w.el.contains(active);\n                if(!w.el.contains(target)&&!bodyTarget)return;\n                if(e.defaultPrevented||OS.focused!==w.id||w.closed||w.minimized||w.desktop!==OS.activeDesktop||OS.$('.lock-screen')||OS.$('#dialog-layer')?.children.length||OS.input.editable(target)||OS.input.editable(active)||archiveActive||path==='/.Trash')return;\n                if(e.type!=='paste'){if(!selected.size||!e.clipboardData)return;copy(e.type==='cut',e);e.preventDefault();return;}\n"],[46802,46970,"                else if(OS.clipboardTools.matchesFileReference(e.clipboardData)){e.preventDefault();OS.guard(paste)();}\n"],[47106,47122,"            };\n            for(const kind of ['copy','cut','paste']){\n                document.addEventListener(kind,fileClipboardEvent,true);\n                w.addCleanup(()=>document.removeEventListener(kind,fileClipboardEvent,true));\n            }\n"]]},{"path":"src/clipboard-service.js","before":"ac734a59ea013b8b12bca453888015c6324e43297ed0a00d921aced8963f497a","after":"14fea4fe44d45910b03f6c858f3ab43be74d3a4519a8cb4c10881fb9e7e26829","ops":[[7377,7377,"        writeFileReference(event,record){\n            if(!event?.clipboardData)return false;\n            const formats=M.fileReferenceFormats(record);\n            event.clipboardData.setData('text/plain',formats['text/plain']);\n            event.clipboardData.setData('text/html',formats['text/html']);\n            event.preventDefault();\n            // Some engines accept only the portable representations above.\n            try{event.clipboardData.setData('application/x-aster-files',record.token);}catch{}\n            return true;\n        },\n        matchesFileReference:(data,record=OS.clipboard)=>M.matchesFileReference(data,record),\n"],[7646,7837,"            const write=e=>this.writeFileReference(e,record);\n"]]},{"path":"src/input-models.js","before":"268f3bd0c3521fc600edab8f87a94fad154b61c7e2ff4c9cfab7d49910f2c3e8","after":"5a747305ea21a09662cf8fbbdf280a1a946ae9ae3b1745013d2a08f2270ea3dc","ops":[[3897,3897,"    // Native clipboards may discard application-specific MIME types. Keep a\n    // token-bearing inert HTML representation too, without changing path text.\n    function fileReferenceFormats(record){\n        if(!record||typeof record.token!=='string'||!/^[a-z0-9-]{1,80}$/i.test(record.token)||!Array.isArray(record.paths)||!record.paths.length||record.paths.some(p=>typeof p!=='string'))throw Error('Invalid file clipboard reference.');\n        const text=transform(record.paths.join('\n'));\n        const escaped=text.replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\n        return {'text/plain':text,'text/html':'<span data-aster-files=\"'+record.token+'\">'+escaped+'</span>','application/x-aster-files':record.token};\n    }\n    function matchesFileReference(data,record){\n        if(!data||!record?.paths?.length)return false;\n        try{\n            const formats=fileReferenceFormats(record),text=data.getData('text/plain');\n            if(typeof text!=='string'||text.replace(/\r\n/g,'\n')!==formats['text/plain'])return false;\n            const custom=data.getData('application/x-aster-files');\n            if(custom)return custom===record.token;\n            const html=data.getData('text/html');\n            if(typeof html!=='string'||html.length>2*LIMITS.text)return false;\n            // Never parse guest clipboard markup into a document or fetch assets.\n            const marker=/<span\s+data-aster-files=\"([a-z0-9-]{1,80})\">/i.exec(html);\n            return !!marker&&marker[1]===record.token;\n        }catch{return false;}\n    }\n"],[6012,6151,"    return Object.freeze({LIMITS,DEFAULTS,preferences,platform,profile,blocked,primary,accelerator,shellAction,transform,fileReferenceFormats,matchesFileReference,History,unpack});\n"]]},{"path":"sw.js","before":"1dd761082abf419d5a6ddb97101685dc31b5928e53b1035faac3cf8e20702dd4","after":"2a2f64ba3037660729f5cf334a09801be858aaf03e3997c17c9535aabec5d64b","ops":[[14,62,"const CACHE = 'aster-desktop-2.4-clipboard-r6';\n"]]},{"path":"tests/clipboard/README.md","before":"9153de863c72015527357f279db2a52eb688051920a88dbb1bc898cfae917709","after":"11c9a1569c59a65d4c663783d9f5d085b834b608d53db3cf12495186ae7efe9e","ops":[[6275,6275,"\n## Final Firefox native file-paste repair\n\nThe retained native-event trace showed Paste targeting BODY while the Files list\nheld focus. It also showed the custom MIME marker missing from the native\nclipboard. Files now routes body-targeted native events to its focused live owner,\nand writes a token-bearing inert HTML fallback alongside the custom format.\nBoth token and exact path text must match the in-memory reference. The unchanged\nnative Copy/Paste scenario still verifies actual copied bytes; an added identical-\npath external text copy must not authorize a stale file operation. Multiple live\nFiles windows must not intercept paste into the focused search field. Unit tests\ncover missing/stale markers, changed text and escaped markup. No test clipboard\nobject, forced permission, or weakened assertion is used for these checks.\n"]]},{"path":"tests/clipboard/browser.py","before":"bfb76ce132ed3b62f54b34190b357e689a88ae3bf17f4967303d19d46822e8c2","after":"f0d033bce2e507b99031cb2f033d77906dffcc00d7670eee54fe7bfeacc2b94c","ops":[[18131,18131,"                # Even identical visible path text is not a file-copy capability.\n                copy_external('/Documents/Clipboard test.txt');page.locator('.explorer-main').click();page.keyboard.press(primary+'+v');js('assert((await OS.fs.list(\"/Documents/Clipboard target\")).length===1);')\n"],[18245,18245,"            def file_focus_isolation():\n                # Leave two Files windows open. A native text paste must stay in\n                # the focused search field, never perform virtual file operations.\n                clean();launch('files',{'path':'/Documents'});js('window.firstFiles=w;');launch('files',{'path':'/Documents/Clipboard target'});js('window.secondFiles=w;');copy_external('search paste Ω')\n                field=page.locator('.window').last.get_by_role('textbox',name='Search this folder');field.click();field.press(primary+'+v');assert field.input_value()=='search paste Ω'\n                js('assert((await OS.fs.list(\"/Documents/Clipboard target\")).length===1);')\n            check('Multiple Files windows cannot intercept native paste into a focused text field',file_focus_isolation)\n"]]},{"path":"tests/clipboard/models.cjs","before":"6a562cfde23e953016396c2c1262a2e42335ff2bbe02fbdc3adf133b37d88986","after":"94a78675c2f71f37bbda6ecb5bb24a277ac7852cc73a5eb54ac5d82823ed152e","ops":[[5067,5067,"\ntest('file reference uses portable inert HTML and preserves readable Unicode paths',()=>{\n    const ref={token:'test-token-123',paths:['/Documents/<script>&\".txt','/Documents/Ω.txt']},f=M.fileReferenceFormats(ref);\n    assert.equal(f['text/plain'],ref.paths.join('\n'));assert.equal(f['application/x-aster-files'],ref.token);\n    assert(!f['text/html'].includes('<script>'));assert(f['text/html'].includes('&lt;script&gt;'));\n    assert(M.matchesFileReference({getData:t=>f[t]||''},ref));\n    assert(M.matchesFileReference({getData:t=>t==='application/x-aster-files'?'':f[t]||''},ref));\n});\ntest('portable file marker cannot authorize stale tokens or plain paths alone',()=>{\n    const ref={token:'new-token',paths:['/Documents/Ω.txt']},f=M.fileReferenceFormats(ref),data=f=>({getData:t=>f[t]||''});\n    assert(!M.matchesFileReference(data({'text/plain':f['text/plain']}),ref));\n    assert(!M.matchesFileReference(data({...f,'application/x-aster-files':'old-token'}),ref));\n    assert(!M.matchesFileReference(data({...f,'text/plain':'external copy'}),ref));\n    assert(!M.matchesFileReference(data({'text/plain':f['text/plain'],'text/html':f['text/html'].replace('new-token','old-token')}),ref));\n    assert(!M.matchesFileReference(data(f),null));\n    assert.throws(()=>M.fileReferenceFormats({token:'\" onclick=\"bad',paths:['a']}));\n    assert.throws(()=>M.fileReferenceFormats({token:'safe',paths:['a'.repeat(M.LIMITS.text+1)]}));\n});\n"]]}]''')
          allowed={'docs/clipboard.md','src/apps-files.js','src/clipboard-service.js','src/input-models.js','sw.js','tests/clipboard/README.md','tests/clipboard/browser.py','tests/clipboard/models.cjs'}
          assert len(changes)==8 and {c['path'] for c in changes}==allowed
          outputs=[]
          for c in changes:
              p=Path(c['path']);assert not p.is_symlink()
              before=p.read_bytes();assert hashlib.sha256(before).hexdigest()==c['before'],'Concurrent change: '+str(p)
              text=before.decode();last=0
              for a,b,value in c['ops']:
                  assert last<=a<=b<=len(text);last=b
              for a,b,value in reversed(c['ops']):text=text[:a]+value+text[b:]
              after=text.encode();assert hashlib.sha256(after).hexdigest()==c['after'],'Output mismatch: '+str(p)
              outputs.append((p,after))
          for p,after in outputs:p.write_bytes(after)
          PY
      - name: Validate runtime and build
        run: |
          for f in src/*.js sdk/*.js sw.js; do node --check "$f"; done
          python3 -m py_compile tests/clipboard/browser.py
          node --test tests/*/models.cjs tests/integrated-shell/contracts.cjs tests/web-apps/catalog.cjs
          python3 build.py
          echo '9a074eaaabe4b721ddf9bd135074b0acc2545ec8fd71d4264f6bda3e10ef00b4  Aster.html' | sha256sum -c -
          git diff --exit-code -- sdk/aster-files.js sdk/aster-clipboard.js tests/results.json
          git diff --check
      - name: Commit verified source and rebuilt standalone
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Aster.html docs/clipboard.md src/apps-files.js src/clipboard-service.js src/input-models.js sw.js tests/clipboard/README.md tests/clipboard/browser.py tests/clipboard/models.cjs
          git commit -m 'Fix native Firefox BODY paste routing and portable token-bearing file clipboard data'
          git push origin HEAD:fix/clipboard-keyboard
