name: Finish clipboard lifecycle verification
on:
  push:
    branches: [fix/clipboard-keyboard]
    paths: ['.github/workflows/finish-clipboard-lifecycle.yml']
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate every before and after hash before writing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          changes=json.loads(r'''[{"path":"docs/clipboard.md","before":"4fb92e5b307edea9a306b20e406601db85c814f4851a68ab0a095029ef0a8b72","after":"b2df3c95d06be7070363841710ceda1bf661a72c7a3d11cf84415f6da5d32113","ops":[[10168,10168,"\nLock-triggered editor blur cannot re-acquire an insertion target. Captures and\nlate history additions are ignored while the visual desktop is locked. This is\nclipboard lifecycle protection, not host-OS authentication or clipboard erasure.\n"]]},{"path":"src/clipboard-service.js","before":"727e146fa937c3fdee8c03114ec13f506972674902d7749ff2ad6bc7727bdb04","after":"ac734a59ea013b8b12bca453888015c6324e43297ed0a00d921aced8963f497a","ops":[[2640,2640,"||OS.$(\".lock-screen\")"],[2770,2770,"            if(OS.$(\".lock-screen\")){this.target=null;return null;}\n"],[14856,14856,"||OS.$('.lock-screen')"]]},{"path":"sw.js","before":"ec1811b669462378f3eacd6a9b9c96f32df0a60c73d7450b7a33241bc9a5ecff","after":"1dd761082abf419d5a6ddb97101685dc31b5928e53b1035faac3cf8e20702dd4","ops":[[58,59,"5"]]},{"path":"tests/clipboard/README.md","before":"34a3f1f1f2673c6961eda55084afd7d6a23761a74cfc3eb4deec2a8f2eb47408","after":"9153de863c72015527357f279db2a52eb688051920a88dbb1bc898cfae917709","ops":[[5490,5490,"\nCommitted file assertions explicitly await each IndexedDB read until the file\nexists, with a failing deadline. A Promise-valued wait_for_function predicate was\ntruthy before its storage result and could race the native paste transaction in\nFirefox. All exact-byte, image-representation and stale-reference assertions are\nretained; no in-memory seeding or transaction is substituted for native paste.\n\nThe lock regression explicitly focuses the real document editor before locking.\nThe resulting focusout must not re-acquire its selection after lock invalidation.\nRemember/capture/add reject while locked, including late asynchronous capture.\nNative macOS testing exposed this focus-order race; target validation and the\nseparate visual-lock/non-authentication boundary remain intact.\n"]]},{"path":"tests/clipboard/browser.py","before":"d545517686d948c9da11a3ffe72fa8e2d23397c9d47ce0367e7ef128e8b67366","after":"bfb76ce132ed3b62f54b34190b357e689a88ae3bf17f4967303d19d46822e8c2","ops":[[2193,2193,"        def stored(path):\n            # wait_for_function polls truthiness; a Promise itself is truthy even\n            # when its eventual IndexedDB result is false. Await each actual read.\n            js('const until=Date.now()+12000;while(!await OS.fs.stat(arg)){if(Date.now()>until)throw Error(\"Timed out waiting for committed file: \"+arg);await new Promise(r=>setTimeout(r,25));}',path)\n"],[17338,17439,"stored('/Documents/Clipboard target/Clipboard test.txt"],[18435,18519,"stored('/Downloads/Pasted fixture.txt"],[21751,21908,"e.click();js('assert(document.activeElement===w.editor);await C.add(\"session secret\");C.setCurrent({text:\"preview secret\",html:\"\",image:null,types:[\"text/plain\"]});OS.lock();assert(!C.current,\"Lock retained a clipboard preview\");assert(!C.target,\"Lock blur reacquired the previous editor target\");assert(!C.remember(w.editor),\"Locked editor became an insertion target\");assert(await C.add(\"late locked capture\")===false,\"Locked history accepted new captured text\""],[24432,24510,"stored('/Pictures/Clipboard.png"]]}]''')
          assert len(changes)==5 and {c['path'] for c in changes}=={'docs/clipboard.md','src/clipboard-service.js','sw.js','tests/clipboard/README.md','tests/clipboard/browser.py'}
          outputs=[]
          for c in changes:
              p=Path(c['path']);assert not p.is_symlink()
              before=p.read_bytes();assert hashlib.sha256(before).hexdigest()==c['before'],'Concurrent change: '+str(p)
              text=before.decode('utf-8');last=0
              for a,b,value in c['ops']:
                  assert isinstance(a,int) and isinstance(b,int) and last<=a<=b<=len(text) and isinstance(value,str);last=b
              for a,b,value in reversed(c['ops']):text=text[:a]+value+text[b:]
              result=text.encode('utf-8');assert hashlib.sha256(result).hexdigest()==c['after'],'Output mismatch: '+str(p)
              outputs.append((p,result))
          for p,result in outputs:p.write_bytes(result)
          PY
      - name: Verify source, models and exact rebuild
        run: |
          for f in src/*.js sdk/*.js sw.js; do node --check "$f"; done
          python3 -m py_compile tests/clipboard/browser.py
          node --test tests/*/models.cjs tests/integrated-shell/contracts.cjs tests/web-apps/catalog.cjs
          python3 build.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          b=Path('Aster.html').read_bytes()
          assert len(b)==6082558 and hashlib.sha256(b).hexdigest()=='0f3e3a9269af40c9368aa1369d309b6cc06dcd7c438dbc657632e174d767aad2'
          PY
          git diff --exit-code -- sdk/aster-files.js sdk/aster-clipboard.js tests/results.json
          git diff --check
      - name: Commit verified lifecycle fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Aster.html docs/clipboard.md src/clipboard-service.js sw.js tests/clipboard/README.md tests/clipboard/browser.py
          git commit -m 'Prevent lock blur from reviving clipboard targets and await actual file-paste transactions'
          git push origin HEAD:fix/clipboard-keyboard
