name: Correct mobile host test readiness
on:
  push:
    branches: [feat/categorized-web-apps]
    paths: ['.github/workflows/web-app-resize-test.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Preserve mobile assertions and await actual layout events
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/web-apps/browser.py');s=p.read_text()
          old="close_all();page.set_viewport_size({'width':390,'height':844});web_index()"
          new="close_all();page.evaluate('window.webResizeSeen=false;window.addEventListener(\"resize\",()=>window.webResizeSeen=true,{once:true})');page.set_viewport_size({'width':390,'height':844});page.wait_for_function('window.webResizeSeen');web_index()"
          assert s.count(old)==1
          p.write_text(s.replace(old,new))
          PY
          python3 -m py_compile tests/web-apps/browser.py
          git diff --check
          rm .github/workflows/web-app-resize-test.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Wait for the actual resize event before testing mobile Start navigation'
          git push origin HEAD:feat/categorized-web-apps
