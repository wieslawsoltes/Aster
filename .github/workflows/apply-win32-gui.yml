name: Import verified Win32 GUI source
on:
  push:
    branches: [feat/win32-gui-resources]
    paths: ['.bootstrap/gui/ready']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the complete source delta and every original file
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, json, lzma
          folder=Path('.bootstrap/gui')
          m=json.loads((folder/'manifest.json').read_text())
          assert m['parts']==8 and m['rawBytes']==193136 and m['encodedBytes']==74176
          assert m['rawSHA256']=='aff17c0b60cfc2d5b5014aa6196a2e7d4c23b586d7e68c15bae81d826f31c74f'
          encoded=''.join((folder/f'part-{i:02}.b64').read_text().strip() for i in range(m['parts']))
          assert len(encoded)==m['encodedBytes']
          compressed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(compressed).hexdigest()==m['archiveSHA256']
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=decoder.decompress(compressed,max_length=m['rawBytes']+1)
          assert decoder.eof and not decoder.unused_data and len(raw)==m['rawBytes']
          assert hashlib.sha256(raw).hexdigest()==m['rawSHA256']
          changes=json.loads(raw)
          assert len(changes)==29 and len({c['path'] for c in changes})==29
          assert set(c['path'] for c in changes)==set(m['paths'])
          outputs=[]
          for c in changes:
              path=PurePosixPath(c['path'])
              assert not path.is_absolute() and '..' not in path.parts and not c['path'].startswith('.')
              p=Path(path)
              if c['before'] is None:
                  assert not p.exists(), 'New path already exists: '+str(p)
                  data=c['content'].encode('utf-8')
              else:
                  before=p.read_bytes()
                  assert hashlib.sha256(before).hexdigest()==c['before'], 'Concurrent source modification: '+str(p)
                  text=before.decode('utf-8'); last=0
                  for a,b,value in c['ops']:
                      assert last<=a<=b<=len(text) and isinstance(value,str)
                      last=b
                  for a,b,value in reversed(c['ops']): text=text[:a]+value+text[b:]
                  data=text.encode('utf-8')
              assert hashlib.sha256(data).hexdigest()==c['after'], 'Result checksum: '+str(p)
              outputs.append((p,data))
          for p,data in outputs:
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          print('Imported and verified',len(outputs),'source paths.')
          PY
          git diff --check
          for f in src/*.js src/win32/*.js sw.js; do node --check "$f"; done
          python3 -m py_compile build.py native/win32/build.py tests/win32/*.py third-party/winemine/build.py
      - name: Install maintainer-only compilers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18 gcc-mingw-w64-i686 binutils-mingw-w64-i686
      - name: Rebuild CPU and pinned upstream application, preserving original EXE fixtures
        env:
          CLANG: clang-18
          LLD_LINK: lld-link-18
          LLVM_AR: llvm-ar-18
        run: |
          mkdir -p /tmp/aster-original-exes
          cp src/win32/examples/*.exe /tmp/aster-original-exes/
          python3 native/win32/build.py
          cp /tmp/aster-original-exes/*.exe src/win32/examples/
          chmod 644 src/win32/x86.wasm src/win32/examples/*.exe
          python3 third-party/winemine/build.py --output /tmp/aster-winemine-build
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil
          b=Path('/tmp/aster-winemine-build');out=Path('third-party/winemine')
          assert hashlib.sha256((b/'winemine.exe').read_bytes()).hexdigest()=='2d170125877b81b6a5313276dfa1885f9103ca9f2c8cc1e42d563a75864f813a'
          shutil.copyfile(b/'winemine.exe','src/win32/third-party/winemine.exe')
          shutil.copyfile(b/'source/COPYING.LIB',out/'COPYING.LIB')
          for name in ['winemine-source.zip','provenance.json']: shutil.copyfile(b/name,out/name)
          PY
          node tests/win32/exports.cjs
          python3 build.py
      - name: Execute CPU, API, original third-party and real GUI runtime tests
        run: |
          node tests/win32/unit.cjs
          node tests/win32/compat.cjs
          node tests/win32/backpressure.cjs
          node tests/win32/gui.cjs
          git diff --check
      - name: Commit editable sources and rebuilt offline edition to the feature branch
        run: |
          rm -rf .bootstrap/gui
          rm .github/workflows/apply-win32-gui.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Implement Win32 resources, dialogs, bitmap WebGPU, private registry and WineMine'
          git push origin HEAD:feat/win32-gui-resources
      - name: Retain import test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: win32-gui-import-evidence
          path: tests/win32/artifacts/
          retention-days: 7
