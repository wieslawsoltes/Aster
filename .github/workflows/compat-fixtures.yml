name: Retrieve original compatibility fixtures
on:
  push:
    branches: [feat/browser-win32]
    paths: ['.github/workflows/compat-fixtures.yml']
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve upstream distributions without executing Windows code
        run: |
          mkdir -p /tmp/fixtures
          python - <<'PY'
          import concurrent.futures, urllib.request, hashlib, json
          from pathlib import Path
          root=Path('/tmp/fixtures')
          urls={
            'tinycc-mirror.zip':'https://download-mirror.savannah.gnu.org/releases/tinycc/tcc-0.9.27-win32-bin.zip',
            'tinycc-source.tar.bz2':'https://download-mirror.savannah.gnu.org/releases/tinycc/tcc-0.9.27.tar.bz2',
            'lzma2603.7z':'https://www.7-zip.org/a/lzma2603.7z',
            'tinycc-mirror2.zip':'https://mirror.csclub.uwaterloo.ca/nongnu/tinycc/tcc-0.9.27-win32-bin.zip'
          }
          def get(item):
              name,url=item
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Aster-compatibility'}),timeout=35) as r:
                      data=r.read(24*1024*1024+1)
                  assert len(data)<=24*1024*1024
                  (root/name).write_bytes(data)
                  return name,{'url':url,'bytes':len(data),'sha256':hashlib.sha256(data).hexdigest()}
              except Exception as e:
                  return name,{'url':url,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              report=dict(pool.map(get,urls.items()))
          (root/'provenance.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report,indent=2))
          PY
          python -m pip install py7zr==1.0.0
          python - <<'PY'
          from pathlib import Path
          import py7zr
          text=Path('/tmp/independent.txt');text.write_text('Independent archive created by py7zr\n')
          with py7zr.SevenZipFile('/tmp/fixtures/independent.7z','w',filters=[{'id':py7zr.FILTER_LZMA2,'dict_size':1048576}]) as archive:
              archive.write(text,'independent.txt')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-compat-fixtures
          path: /tmp/fixtures/
          retention-days: 3
