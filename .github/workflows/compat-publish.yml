name: Import verified Win32 compatibility extension
on:
  push:
    branches: [feat/browser-win32]
    paths: ['.compat-payload/ready']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source payload and unchanged base, then apply exact line edits
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, json, lzma, shutil
          root = Path.cwd()
          folder = root / '.compat-payload'
          manifest = json.loads((folder/'manifest.json').read_text())
          assert manifest['parts'] == 8
          packed = base64.b64decode(''.join((folder/f'part-{i:02d}.b64').read_text().strip() for i in range(8)), validate=True)
          assert len(packed) == 49132
          assert hashlib.sha256(packed).hexdigest() == '642d795e23fed9a7396e9216a91b5f51053c5348e9d19f7a969b9a7df3f91d56'
          raw = lzma.decompress(packed, memlimit=128*1024*1024)
          assert hashlib.sha256(raw).hexdigest() == '65a48b0a87569bbb97bb7049ccdfeaf7fb6e0dd60cd32af57692c652c3462374'
          records = json.loads(raw)
          assert len(records) == 26
          writes = {}
          for name, record in records.items():
              path = PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and not name.startswith('.')
              destination = root/name
              assert destination.resolve().is_relative_to(root) and not destination.is_symlink()
              before = destination.read_bytes() if destination.exists() else None
              actual = hashlib.sha256(before).hexdigest() if before is not None else None
              assert actual == record['before'], f'Concurrent source change: {name}'
              if 'base64' in record:
                  data = base64.b64decode(record['base64'], validate=True)
              else:
                  lines = before.decode().splitlines(keepends=True) if before is not None else []
                  for start, end, text in reversed(record['edits']):
                      assert 0 <= start <= end <= len(lines)
                      lines[start:end] = text.splitlines(keepends=True)
                  data = ''.join(lines).encode()
              assert hashlib.sha256(data).hexdigest() == record['after'], name
              writes[destination] = data
          for destination, data in writes.items():
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
          shutil.rmtree(folder)
          print(f'Applied {len(writes)} checksum-verified source changes.')
          PY
      - name: Reproduce unmodified upstream fixtures and build original Aster CPU
        env:
          CLANG: clang-18
          LLD_LINK: lld-link-18
          LLVM_AR: llvm-ar-18
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18
          python third-party/fetch.py
          python native/win32/build.py
          node tests/win32/exports.cjs
          python build.py
          node tests/win32/unit.cjs
          node tests/win32/compat.cjs
      - name: Commit editable source, pinned programs and complete offline edition
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Run original 7-Zip and TinyCC entirely in browser with CRT, TLS, private DLLs and x87 compatibility'
          git push origin HEAD:feat/browser-win32
