name: Add bounded renderer backpressure
on:
  push:
    branches: [feat/browser-win32]
    paths: ['.github/workflows/render-backpressure.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Update runtime scheduling and render acknowledgements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def edit(name, changes):
              p=Path(name);s=p.read_text()
              for old,new,count in changes:
                  assert s.count(old)==count,(name,old,s.count(old))
                  s=s.replace(old,new)
              p.write_text(s)
          edit('src/win32/runtime.js',[
              ('this.nextRequest=1;this.logBytes=0;','this.graphicsReady=Promise.resolve();this.drawBackpressure=false;this.nextRequest=1;this.logBytes=0;',1),
              ('emit(type,value={}) {this.host({type,...value});}','emit(type,value={}) {return this.host({type,...value});}',1),
              ("flush() {for(const [hwnd,commands]of this.pendingDraws)this.emit('draw',{hwnd,commands});this.pendingDraws.clear();this.drawCount=0;}","flush() {const jobs=[];for(const [hwnd,commands]of this.pendingDraws){const job=this.emit('draw',{hwnd,commands});if(job&&typeof job.then==='function')jobs.push(job);}this.pendingDraws.clear();this.drawCount=0;if(jobs.length){this.graphicsReady=Promise.all([this.graphicsReady,...jobs]);this.drawBackpressure=true;}return this.graphicsReady;}",1),
              ('        c.set_reg(0,(value??0)>>>0);','        if(this.drawBackpressure){await this.graphicsReady;this.drawBackpressure=false;}\n        c.set_reg(0,(value??0)>>>0);',1),
              ('{this.flush();await new Promise(r=>setTimeout(r,0));','{await this.flush();await new Promise(r=>setTimeout(r,0));',2),
              ("if(!child)this.mainWindow=hwnd;this.emit('window',","if(!child)this.mainWindow=hwnd;await this.emit('window',",1)
          ])
          edit('src/apps-win32.js',[
              ('this.fit();this.renderer.canvas.focus();',"this.fit();this.renderer.canvas.focus();if(e.credit)this.send({type:'ack',credit:e.credit});",1),
              ('this.renderer.enqueue(e.commands);}',"this.renderer.enqueue(e.commands);if(e.credit){await new Promise(resolve=>requestAnimationFrame(resolve));this.renderer.flush();if(this.renderer.device)await this.renderer.device.queue.onSubmittedWorkDone();this.send({type:'ack',credit:e.credit});}}",1)
          ])
          edit('tests/win32/browser.py',[
              ('for(const w of [...Aster.windows.values()])await w.close(true);document.querySelectorAll','for(const w of [...Aster.windows.values()])await w.close(true);Aster.settings.motion=false;Aster.applySettings();document.querySelectorAll',1),
              ('page.set_default_timeout(15000)','page.set_default_timeout(45000 if args.gpu else 15000)',1)
          ])
          Path('src/win32/worker.js').write_text('''/* Dedicated worker transport. Render credits provide bounded backpressure. MIT. */
          'use strict';
          let process=null,started=false,flushing=false,nextCredit=1;
          const credits=new Map();
          function releaseCredits(){for(const resolve of credits.values())resolve();credits.clear();}
          function host(event){
              if(event.type==='draw'||(event.type==='window'&&!event.parent)){
                  if(credits.size>=8)throw Error('Unacknowledged graphics batch quota exceeded');
                  const credit=nextCredit++,promise=new Promise(resolve=>credits.set(credit,resolve));
                  postMessage({...event,credit});return promise;
              }
              postMessage(event);if(event.type==='exit'){releaseCredits();savedFiles();}
          }
          function savedFiles(force=false){
              if(!process||flushing||(!force&&!process.dirtyFiles.size))return;flushing=true;
              const files=[];for(const path of (force?process.files.keys():process.dirtyFiles)){const bytes=process.files.get(path).slice();files.push({path,bytes});}
              process.dirtyFiles.clear();postMessage({type:'files',files,revision:process.fileRevision},files.map(f=>f.bytes.buffer));flushing=false;
          }
          function crash(error){releaseCredits();savedFiles();process?.exit(1);postMessage({type:'error',message:String(error.message||error),stats:process?.stats()});}
          onmessage=async({data})=>{
              try{
                  if(data.type==='ack'){const resolve=credits.get(data.credit);if(resolve){credits.delete(data.credit);resolve();}return;}
                  if(data.type==='start'){
                      if(started)throw Error('Worker already owns a process');started=true;
                      process=await AsterWin32.Runtime.create(data.wasm,host,data.options||{});
                      if(!Array.isArray(data.files)||data.files.length>128)throw Error('Invalid file snapshot');
                      for(const file of data.files)process.addFile(file.path,file.bytes);
                      process.load(new Uint8Array(data.exe),data.name);process.run().catch(crash);
                  } else if(data.type==='snapshot'){savedFiles(true);}
                  else if(data.type==='stop'){releaseCredits();process?.exit(0);savedFiles(true);postMessage({type:'stopped'});}
                  else if(process&&!process.stopped)process.event(data);
              }catch(error){crash(error);}
          };
          setInterval(()=>savedFiles(),500);
          ''')
          p=Path('docs/browser-win32.md')
          p.write_text(p.read_text()+'\nGraphics use acknowledged Worker credits: top-level window creation waits for the browser surface, and batches wait for presentation/GPU completion before guest drawing continues. A deliberately slow-display regression runs the real GDI EXE and verifies bounded outstanding batches. This prevents a fast guest from overflowing the renderer during GPU initialization or slow software rendering.\n')
          PY
          for file in src/apps-win32.js src/win32/*.js; do node --check "$file"; done
          python3 -m py_compile tests/win32/browser.py
          python3 build.py
          node tests/win32/unit.cjs
      - name: Commit bounded rendering and standalone build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/apps-win32.js src/win32/runtime.js src/win32/worker.js tests/win32/browser.py docs/browser-win32.md Aster.html
          git commit -m "Backpressure guest drawing until surfaces and GPU batches are ready"
          git push origin HEAD:feat/browser-win32
