name: Complete reviewed UI lifecycle fixes
on:
  push:
    branches: [fix/theme-controls-original-icons]
    paths: ['.github/workflows/finish-ui-lifecycle.yml']
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the complete hash-checked four-file correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma
          encoded=''
          data=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(data).hexdigest()=='511919072ece5902102944d43dbb914c613e21e23b2691f783a7405f9d190f59'
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=decoder.decompress(data,max_length=3994)
          assert decoder.eof and not decoder.unused_data and len(raw)==3993
          assert hashlib.sha256(raw).hexdigest()=='c82436a7b46d477d9ac76b881762221aad029511e6f45ef44413a35481c7d672'
          changes=json.loads(raw)
          assert len(changes)==4 and {c['path'] for c in changes}=={'src/shell-launch.js','tests/ui-refinement/browser.py','tests/ui-refinement/models.cjs','docs/ui-refinement.md'}
          outputs=[]
          for c in changes:
              p=Path(c['path']);before=p.read_bytes();assert not p.is_symlink()
              assert hashlib.sha256(before).hexdigest()==c['before'],'Concurrent edit: '+str(p)
              text=before.decode();last=0
              for a,b,s in c['ops']:
                  assert isinstance(a,int) and isinstance(b,int) and last<=a<=b<=len(text) and isinstance(s,str)
                  last=b
              for a,b,s in reversed(c['ops']):text=text[:a]+s+text[b:]
              data=text.encode();assert hashlib.sha256(data).hexdigest()==c['after'],str(p)
              outputs.append((p,data))
          for p,data in outputs:p.write_bytes(data)
          PY
      - name: Validate and rebuild without changing inherited browser assertions
        run: |
          node --check src/shell-launch.js
          python3 -m py_compile tests/ui-refinement/browser.py
          python3 build.py
          node --test tests/ui-refinement/models.cjs tests/shell-launch/models.cjs
          git diff --check
      - name: Commit the fixes and regression on the current PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/shell-launch.js tests/ui-refinement/browser.py tests/ui-refinement/models.cjs docs/ui-refinement.md Aster.html
          git commit -m 'Release Run guard on dialog completion and respect restored topmost windows in offline test'
          git push origin HEAD:fix/theme-controls-original-icons
