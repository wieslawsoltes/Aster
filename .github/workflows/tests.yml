name: Tests
on:
  push:
    branches: [build/catalog-workspace-apps]
    paths: [.github/workflows/tests.yml]
permissions:
  contents: write
concurrency:
  group: prepare-catalog-workspace-apps
  cancel-in-progress: false
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit the five actual public Pages documents and preserve existing catalog records
        run: python -u .github/scripts/add-five-apps.py
      - name: Verify the unmodified production workflows, all models and rebuilt standalone
        run: |
          git show e797446a15ab51bd67d0950e2161e6e9d386f08b:.github/workflows/tests.yml > .github/workflows/tests.yml
          python -m pip install PyYAML
          python -m unittest discover -s tests/ci -p 'test_*.py' -v
          node --check src/web-app-catalog.js
          node --check sw.js
          python -m py_compile tests/web-apps/browser.py tests/app-library/browser.py tests/smoke.py
          python build.py
          node --test tests/*/models.cjs tests/integrated-shell/contracts.cjs tests/web-apps/catalog.cjs tests/themes/win32.cjs
          git diff --exit-code -- sdk/aster-files.js sdk/aster-clipboard.js tests/results.json
          git diff --check
      - name: Install browser verification dependencies
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers xvfb
      - name: Actual HTTP host, new Start entries and standalone catalog
        run: |
          python -u tests/web-apps/browser.py
          mkdir -p /tmp/catalog-evidence
          cp -R tests/web-apps/artifacts /tmp/catalog-evidence/host
      - name: Actual App Center Discover and installed-app regression
        run: python -u tests/app-library/browser.py
      - name: Real deployed catalog startup including all five new apps
        run: xvfb-run -a -s '-screen 0 1440x1000x24' python -u tests/web-apps/browser.py --live --gpu --headed
      - name: Commit only validated source, documentation and generated standalone to the preparation branch
        run: |
          git checkout HEAD -- .github/workflows/tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/web-app-catalog.js docs/web-app-inventory.json tests/web-apps/catalog.cjs tests/web-apps/browser.py tests/app-library/browser.py tests/smoke.py README.md docs/web-apps.md docs/app-library.md tests/web-apps/README.md tests/app-library/README.md sw.js Aster.html
          git diff --cached --check
          git commit -m 'Add Velsign, Folio, Mireva Studio, Orivane and Velora with verified catalog launch coverage'
          git push origin HEAD:build/catalog-workspace-apps
      - name: Preserve prepared source and verification reports
        if: always()
        run: |
          mkdir -p /tmp/catalog-evidence
          cp -R tests/web-apps/artifacts /tmp/catalog-evidence/live 2>/dev/null || true
          cp -R tests/app-library/artifacts /tmp/catalog-evidence/app-library 2>/dev/null || true
          git archive --format=zip HEAD -o /tmp/catalog-evidence/source.zip
          git diff > /tmp/catalog-evidence/uncommitted.diff
          python - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          files = subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          Path('/tmp/catalog-evidence/prepared.json').write_text(json.dumps({
              'commit': subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
              'tree': subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip(),
              'files': {p:hashlib.sha256(Path(p).read_bytes()).hexdigest() for p in files if p and Path(p).is_file()}
          },indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-workspace-apps-evidence
          path: /tmp/catalog-evidence/
          retention-days: 14
