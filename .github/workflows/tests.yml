name: Tests
on:
  push:
    branches: [build/catalog-workspace-apps]
    paths: [.github/workflows/tests.yml]
permissions:
  contents: write
concurrency:
  group: prepare-catalog-workspace-apps
  cancel-in-progress: false
jobs:
  live-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require actionable controls instead of loading-screen evidence
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('tests/web-apps/browser.py');before=p.read_bytes()
          assert hashlib.sha256(before).hexdigest()=='2a7192cebf9ed80d82af29151878615478b00a3a373de4336bf350350c49a16c'
          text=before.decode('utf-8');old='                        info=embedded.evaluate('
          lines=[
              '# New catalog apps must expose an actionable UI, not just a loading screen.',
              "ready={'Velsign':'Upload a document','Folio':'Share','MirevaStudio':'Preview','Orivane':'Workspace','Velora':'Present'}",
              "if app['repo'] in ready:",
              "    embedded.get_by_role('button',name=ready[app['repo']],exact=False).first.click(trial=True,timeout=45000)",
              "    row['actionableControl']=ready[app['repo']]",
              'info=embedded.evaluate('
          ]
          new='\n'.join(' '*24+line for line in lines)
          assert text.count(old)==1
          result=text.replace(old,new).encode('utf-8')
          assert hashlib.sha256(result).hexdigest()=='bcda77d453dcf6152dc0c5a51928439697ae37672e0c979d6c27aafbaa0ca101'
          p.write_bytes(result)
          PY
          python -m py_compile tests/web-apps/browser.py
          git diff --check
      - name: Install browser dependencies
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers xvfb
      - name: Launch the actual 84-app catalog and wait for the five new interfaces
        run: xvfb-run -a -s '-screen 0 1440x1000x24' python -u tests/web-apps/browser.py --live --gpu --headed
      - name: Commit only the verified readiness regression
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/web-apps/browser.py
          git commit -m 'Wait for actionable controls in each new catalog app before recording live startup'
          git push origin HEAD:build/catalog-workspace-apps
      - name: Preserve actual app evidence and final prepared source
        if: always()
        run: |
          mkdir -p /tmp/catalog-ready
          git archive --format=zip HEAD -o /tmp/catalog-ready/source.zip
          git rev-parse HEAD > /tmp/catalog-ready/commit.txt
          git diff > /tmp/catalog-ready/uncommitted.diff
          cp -R tests/web-apps/artifacts /tmp/catalog-ready/live 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-live-ready-evidence
          path: /tmp/catalog-ready/
          retention-days: 14
