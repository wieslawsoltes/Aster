name: Tests
on:
  push:
    branches: [build/catalog-workspace-apps]
    paths: [.github/workflows/tests.yml]
permissions:
  contents: write
concurrency:
  group: prepare-catalog-workspace-apps
  cancel-in-progress: false
jobs:
  live-readiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for the actual board rather than a pointer-transparent splash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('tests/web-apps/browser.py');before=p.read_bytes()
          assert hashlib.sha256(before).hexdigest()=='bcda77d453dcf6152dc0c5a51928439697ae37672e0c979d6c27aafbaa0ca101'
          text=before.decode('utf-8');old="                        if app['repo'] in ready:\n"
          new="                        if app['repo']=='Orivane':\n                            embedded.get_by_text('A shared space for better ideas.',exact=True).wait_for(state='hidden',timeout=45000)\n"+old
          assert text.count(old)==1
          result=text.replace(old,new).encode('utf-8')
          assert hashlib.sha256(result).hexdigest()=='b82c96b5641c777f22da3675451c03d59a4c56b2cd400b44b589bb475ed19b9a'
          p.write_bytes(result)
          PY
          python -m py_compile tests/web-apps/browser.py
          git diff --check
      - name: Install browser dependencies
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers xvfb
      - name: Actual 84-app catalog with visible new-app interfaces
        run: xvfb-run -a -s '-screen 0 1440x1000x24' python -u tests/web-apps/browser.py --live --gpu --headed
      - name: Commit only the verified readiness regression
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/web-apps/browser.py
          git commit -m 'Wait for the Orivane board to replace its startup overlay in live catalog checks'
          git push origin HEAD:build/catalog-workspace-apps
      - name: Preserve evidence and final source
        if: always()
        run: |
          mkdir -p /tmp/catalog-ready
          git archive --format=zip HEAD -o /tmp/catalog-ready/source.zip
          git rev-parse HEAD > /tmp/catalog-ready/commit.txt
          git diff > /tmp/catalog-ready/uncommitted.diff
          cp -R tests/web-apps/artifacts /tmp/catalog-ready/live 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-live-ready-evidence
          path: /tmp/catalog-ready/
          retention-days: 14
