name: Tests
on:
  push:
    branches: [build/catalog-workspace-apps]
    paths: [.github/workflows/tests.yml]
permissions:
  contents: write
concurrency:
  group: prepare-catalog-workspace-apps
  cancel-in-progress: false
jobs:
  regression-counts:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve exact registration assertions across inherited suites
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          changes = [
              ('tests/themes/browser.py','61f19c9226cc394b7bdaec1c59e672a04f4bc960689466f09215962c2726983a','b180e8755c9c2dda4a0935e695e80388e2d06322844db135e7adc390f3fcd1a0',1),
              ('tests/desktop-features/browser.py','9ffcf3e03752f11a0a373819c6005a0f817434bef335d6243e74c56b73a2ce3f','a639460e54febd11995ee3c2d3b78b3c29dc0e5cd5f0f2116dfd510ddfb33411',2),
              ('tests/integrated-shell/browser.py','bb0a477127f9b647a82492072e9af0fba3a63fe7c3e08750145816fa799be509','2d8583bc0d1e0e3b7ed587af21364d627930cececcb597ca825160eeafd8f453',1),
              ('tests/web-chrome/models.cjs','b81d7264eb4803c860aaa9d7e627f6af29234f3f384441a9582201a682b2dffb','1232588bd5de328dc928fe7b05e7a19108a27a66ef289a411b751720b915efac',1)
          ]
          outputs=[]
          for name,before,after,count in changes:
              p=Path(name);data=p.read_bytes()
              assert hashlib.sha256(data).hexdigest()==before,name
              text=data.decode('utf-8');assert text.count('79')==count,name
              result=text.replace('79','84').encode('utf-8')
              assert hashlib.sha256(result).hexdigest()==after,name
              outputs.append((p,result))
          for p,result in outputs:p.write_bytes(result)
          PY
          git show e797446a15ab51bd67d0950e2161e6e9d386f08b:.github/workflows/tests.yml > .github/workflows/tests.yml
          python -m pip install PyYAML
          python -m unittest discover -s tests/ci -p 'test_*.py' -v
          python build.py
          git diff --exit-code -- Aster.html sdk/aster-files.js sdk/aster-clipboard.js
          node --test tests/*/models.cjs tests/integrated-shell/contracts.cjs tests/web-apps/catalog.cjs tests/themes/win32.cjs
          git diff --check
      - name: Install browser
        run: |
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Run all affected inherited HTTP and standalone suites
        run: bash .github/scripts/browser-tests.sh chromium themes desktop-features integrated-shell
      - name: Commit validated count updates only
        run: |
          git checkout HEAD -- .github/workflows/tests.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/themes/browser.py tests/desktop-features/browser.py tests/integrated-shell/browser.py tests/web-chrome/models.cjs
          git commit -m 'Update inherited desktop regression counts for the 84-app catalog'
          git push origin HEAD:build/catalog-workspace-apps
      - name: Preserve final source and regression reports
        if: always()
        run: |
          mkdir -p /tmp/catalog-final
          git archive --format=zip HEAD -o /tmp/catalog-final/source.zip
          git rev-parse HEAD > /tmp/catalog-final/commit.txt
          git diff > /tmp/catalog-final/uncommitted.diff
          cp -R tests/ci/artifacts /tmp/catalog-final/logs 2>/dev/null || true
          cp -R tests/themes/artifacts /tmp/catalog-final/themes 2>/dev/null || true
          cp -R tests/desktop-features/artifacts /tmp/catalog-final/desktop-features 2>/dev/null || true
          cp -R tests/integrated-shell/artifacts /tmp/catalog-final/integrated-shell 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-regression-finalization
          path: /tmp/catalog-final/
          retention-days: 14
