name: Requested app integration maintenance
on:
  push:
    branches: [feat/requested-web-apps-september-22]
    paths: [.github/workflows/requested-apps-maintenance.yml]
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply the exact locally verified patch and rebuild standalone
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          patch = lzma.decompress(base64.b64decode(Path('.aster-requested-apps.patch.xz.b64').read_text()))
          assert hashlib.sha256(patch).hexdigest() == 'b569c2dc0d1c9f0303d13a670bf7f9703e3c12bd954cd78e8c340a9ac80820b2', 'Patch integrity check failed'
          Path('/tmp/aster-requested-apps.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--unidiff-zero', '/tmp/aster-requested-apps.patch'], check=True)
          subprocess.run(['git', 'apply', '--unidiff-zero', '/tmp/aster-requested-apps.patch'], check=True)
          PY
          python build.py
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md Aster.html docs/app-library.md docs/web-app-inventory.json docs/web-apps.md src/apps-web.js src/web-app-catalog.js src/web-navigation.js sw.js tests/app-library/README.md tests/app-library/browser.py tests/desktop-features/browser.py tests/integrated-shell/browser.py tests/smoke.py tests/themes/browser.py tests/web-apps/README.md tests/web-apps/browser.py tests/web-apps/catalog.cjs tests/web-apps/requested-2026-09-22.json tests/web-chrome/models.cjs
          git commit -m 'feat: add 26 reviewed web apps to Aster and verify launch integration'
      - name: Verify source, all model suites and reproducible standalone
        run: |
          python -m pip install PyYAML
          # The integration transport is temporary. Check the final two-workflow topology.
          mv .github/workflows/requested-apps-maintenance.yml /tmp/requested-apps-maintenance.yml
          trap 'mv /tmp/requested-apps-maintenance.yml .github/workflows/requested-apps-maintenance.yml' EXIT
          bash .github/scripts/check-source.sh
      - name: Push verified source to the integration branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/feat/requested-web-apps-september-22'
          test -z "$(git status --porcelain --untracked-files=no)"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/feat/requested-web-apps-september-22
          git rev-parse HEAD
      - name: Install browser validation dependencies
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 xvfb
      - name: HTTP-hosted launcher and App Center regression suites
        run: |
          python tests/web-apps/browser.py
          python tests/app-library/browser.py
          mkdir -p /tmp/aster-validation/fixtures
          cp -R tests/web-apps/artifacts /tmp/aster-validation/fixtures/web-apps
          cp -R tests/app-library/artifacts /tmp/aster-validation/fixtures/app-library
      - name: Real deployed iframe startup for all 26 requested apps
        run: |
          xvfb-run -a -s '-screen 0 1440x1000x24' python tests/web-apps/browser.py --live --gpu --headed --repos Veyra ChromaForgeMaterialStudio VeyraStudio TesseraStudio LumeraStudio RelayForgeElectrical AstrumStudio VectorStudio StratumFX CinderLab TerraWeave ImplicitForge PatinaStudio PigmentLab Orbitarium DuoStudio ApertureCAD DrawingWeb CounterformStudio RevectorStudio AvenorMail Auralis ClaudeCodeDesign RichTextWeb GridWeb XamoraStudio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: requested-app-integration-validation
          path: |
            tests/web-apps/artifacts/
            tests/app-library/artifacts/
            tests/ci/artifacts/
            /tmp/aster-validation/
          retention-days: 7
