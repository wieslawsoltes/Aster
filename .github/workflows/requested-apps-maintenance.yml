name: Requested app integration maintenance
on:
  push:
    branches: [feat/requested-web-apps-september-22]
    paths: [.github/workflows/requested-apps-maintenance.yml]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect repository metadata, documentation and Pages entry points
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/aster-app-audit
          cat > /tmp/audit.py <<'PY'
          import base64, concurrent.futures, datetime, hashlib, html, json, os, re, urllib.request, urllib.error
          from pathlib import Path
          from urllib.parse import urlsplit
          OUT = Path('/tmp/aster-app-audit')
          REPOS = 'Veyra ChromaForgeMaterialStudio VeyraStudio TesseraStudio LumeraStudio RelayForgeElectrical AstrumStudio VectorStudio StratumFX CinderLab TerraWeave ImplicitForge PatinaStudio PigmentLab Orbitarium DuoStudio ApertureCAD DrawingWeb CounterformStudio RevectorStudio AvenorMail Auralis ClaudeCodeDesign RichTextWeb GridWeb XamoraStudio'.split()
          def get(url, api=False):
              headers = {'User-Agent': 'Aster-requested-app-audit'}
              if api:
                  assert urlsplit(url).netloc == 'api.github.com'
                  headers['Authorization'] = 'Bearer ' + os.environ['GH_TOKEN']
                  headers['Accept'] = 'application/vnd.github+json'
              request = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=35) as response:
                      return response.status, response.url, dict(response.headers.items()), response.read()
              except urllib.error.HTTPError as error:
                  return error.code, error.url, dict(error.headers.items()), error.read()
          def api(path):
              status, url, headers, body = get('https://api.github.com/' + path, True)
              if status != 200: raise RuntimeError(f'{url}: {status}')
              return json.loads(body)
          def audit(name):
              data = {'name': name, 'auditedAt': datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  meta = api('repos/wieslawsoltes/' + name)
                  data['metadata'] = {key: meta.get(key) for key in ('full_name','created_at','default_branch','description','homepage','html_url','has_pages','archived','fork','visibility')}
                  readme = api('repos/wieslawsoltes/' + name + '/readme')
                  text = base64.b64decode(readme['content']).decode('utf-8')
                  data['readmeSHA'] = readme['sha']
                  data['readmePath'] = readme['path']
                  (OUT / (name + '.md')).write_text(text)
                  tree = api('repos/wieslawsoltes/' + name + '/git/trees/' + meta['default_branch'] + '?recursive=1')
                  data['entryFiles'] = [item['path'] for item in tree.get('tree', []) if item['path'].endswith(('.html', '.yml', '.yaml')) and not item['path'].startswith(('node_modules/', 'vendor/'))][:200]
                  root = 'https://wieslawsoltes.github.io/' + name + '/'
                  candidates = [root]
                  for candidate in [meta.get('homepage') or ''] + re.findall(r'https://wieslawsoltes\.github\.io/[^\s<>\)\]"`]+', text):
                      candidate = candidate.rstrip('.,;')
                      parsed = urlsplit(candidate)
                      if parsed.scheme == 'https' and parsed.netloc == 'wieslawsoltes.github.io' and parsed.path.startswith('/' + name + '/') and not parsed.query and not parsed.fragment and candidate not in candidates:
                          candidates.append(candidate)
                  data['deployments'] = []
                  for i, url in enumerate(candidates[:6]):
                      try:
                          status, final, headers, body = get(url)
                          decoded = body.decode('utf-8', errors='replace')
                          title = re.search(r'<title[^>]*>(.*?)</title>', decoded, re.I|re.S)
                          data['deployments'].append({'url': url, 'finalUrl': final, 'status': status, 'title': html.unescape(re.sub(r'\s+', ' ', title.group(1)).strip()) if title else '', 'headers': {key.lower(): value for key, value in headers.items()}, 'bytes': len(body), 'sha256': hashlib.sha256(body).hexdigest(), 'auditedAt': datetime.datetime.now(datetime.timezone.utc).isoformat()})
                          (OUT / (name + '-' + str(i) + '.html')).write_bytes(body)
                      except Exception as error:
                          data['deployments'].append({'url': url, 'error': str(error)})
              except Exception as error:
                  data['error'] = str(error)
              return data
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:
              results = list(pool.map(audit, REPOS))
          (OUT / 'audit.json').write_text(json.dumps(results, indent=2) + '\n')
          for result in results:
              print(json.dumps(result))
          PY
          python /tmp/audit.py
          git archive HEAD > /tmp/aster-app-audit/aster-source.tar
          find . -name AGENTS.md -not -path './.git/*' -print -exec cat {} \; > /tmp/aster-app-audit/agent-instructions.txt
      - uses: actions/upload-artifact@v4
        with:
          name: requested-app-audit
          path: /tmp/aster-app-audit
          retention-days: 7
