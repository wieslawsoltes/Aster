name: Repair recovered picker reload wait
on:
  push:
    branches: [feat/profile-file-pickers]
    paths: ['.github/workflows/fix-picker-wait.yml']
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Validate and apply the single test synchronization repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('tests/file-pickers/browser.py');before=p.read_bytes()
          assert hashlib.sha256(before).hexdigest()=='26e7afbb5afe090060cf30ff5573ddba1fd123835f95c80ac037eb076329032e'
          old='''d=page.get_by_role('dialog',name='Open from Aster',exact=True);page.wait_for_function('document.querySelector(".io-picker").dataset.view==="grid"')'''
          new='''d=page.get_by_role('dialog',name='Open from Aster',exact=True);d.wait_for(state='visible');page.wait_for_function('document.querySelector(".io-picker")?.dataset.view==="grid"')'''
          text=before.decode('utf-8');assert text.count(old)==1
          result=text.replace(old,new).encode('utf-8')
          assert hashlib.sha256(result).hexdigest()=='cbc2dcc7e1ef53408e1eb2a0646b61b9889efd165a67f2f64e4df6e45539b7e8'
          p.write_bytes(result)
          PY
          python3 -m py_compile tests/file-pickers/browser.py
          git diff --check
      - name: Commit only the verified test change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/file-pickers/browser.py
          git commit -m 'Wait for the restored picker before checking persisted view state'
          git push origin HEAD:feat/profile-file-pickers
