name: Finalize browser Win32 rendering lifecycle
on:
  push:
    branches: [feat/browser-win32]
    paths: ['.github/workflows/win32-flow-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Apply guarded incremental source edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          staged={}
          def edit(name,old,new):
              s=staged.get(name,Path(name).read_text());assert s.count(old)==1,(name,old,s.count(old));staged[name]=s.replace(old,new)
          edit('src/win32/runtime.js','this.graphicsReady=Promise.all([this.graphicsReady,...jobs]);','this.graphicsReady=Promise.all([this.graphicsReady,...jobs]).then(()=>undefined);')
          edit('src/win32/runtime.js','draw(hwnd,command) {if(++this.drawCount>4096)this.flush();',"draw(hwnd,command) {if(++this.drawCount>4096)throw Error('GDI batch quota exceeded');")
          edit('src/win32/runtime.js','        if(this.drawBackpressure){await this.graphicsReady;','        if(this.drawCount>=4096)this.flush();\n        if(this.drawBackpressure){await this.graphicsReady;')
          edit('src/win32/runtime.js','        this.flush();return this.exitCode;','        await this.flush();return this.exitCode;')
          edit('src/win32/runtime.js','    request(type,fields={}) {this.flush();','    async request(type,fields={}) {await this.flush();')
          edit('src/win32/runtime.js',"if(!wait||this.stopped)return 0;this.flush();this.emit('idle'","if(!wait||this.stopped)return 0;await this.flush();this.emit('idle'")
          edit('src/win32/gdi.js','this.dead=false;this.errors=[];','this.dead=false;this.errors=[];this.peakQueuedCommands=0;this.acknowledgedBatches=0;')
          edit('src/win32/gdi.js',"        this.pending.push(...commands);if(!this.frame)this.frame=requestAnimationFrame(()=>{this.frame=0;try{this.flush();}catch(error){this.fail(error);}});", """        this.pending.push(...commands);this.peakQueuedCommands=Math.max(this.peakQueuedCommands,this.pending.length);
                  if(!this.frame&&!this.frameTimer){
                      const render=()=>{try{this.flush();}catch(error){this.fail(error);}};
                      this.frame=requestAnimationFrame(render);this.frameTimer=setTimeout(render,64);
                  }""")
          edit('src/win32/gdi.js','    measure(text,size)',"""    async submit(commands) {
                  if(this.dead)throw Error('Renderer has stopped');
                  this.enqueue(commands);this.flush();
                  if(this.dead)throw Error('Renderer rejected the batch');
                  if(this.mode==='WebGPU')await this.device.queue.onSubmittedWorkDone();
                  this.acknowledgedBatches++;
                  return this.stats();
              }
              measure(text,size)""")
          edit('src/win32/gdi.js','        if(this.dead||!this.pending.length)return;const commands=this.pending.splice(0);this.frames++;',"        if(this.frame)cancelAnimationFrame(this.frame);if(this.frameTimer)clearTimeout(this.frameTimer);this.frame=this.frameTimer=0;\n        if(this.dead||!this.pending.length)return;const commands=this.pending.splice(0);")
          edit('src/win32/gdi.js','        this.options.onFrame?.(this.stats());','        this.frames++;this.options.onFrame?.(this.stats());')
          edit('src/win32/gdi.js','frames:this.frames,drawCalls:','frames:this.frames,acknowledgedBatches:this.acknowledgedBatches,peakQueuedCommands:this.peakQueuedCommands,queuedCommands:this.pending.length,drawCalls:')
          edit('src/win32/gdi.js','if(this.frame)cancelAnimationFrame(this.frame);this.pending=[];','if(this.frame)cancelAnimationFrame(this.frame);if(this.frameTimer)clearTimeout(this.frameTimer);this.frame=this.frameTimer=0;this.pending=[];')
          edit('src/apps-win32.js','this.closed=false;this.sequence=Promise.resolve();','this.closed=false;this.halted=false;this.exitCode=null;this.sequence=Promise.resolve();')
          edit('src/apps-win32.js','        this.worker.onmessage=({data})=>{this.sequence=this.sequence.then(()=>this.receive(data)).catch(error=>this.error(error));};',"""        this.worker.onmessage=({data})=>{
                      if(['files','stopped','stats'].includes(data.type))this.receive(data).catch(error=>this.error(error));
                      else this.sequence=this.sequence.then(()=>this.receive(data)).catch(error=>this.error(error));
                  };""")
          edit('src/apps-win32.js','error(error){if(this.failed)return;','error(error){if(this.failed||this.closed||this.halted)return;')
          edit('src/apps-win32.js',"if((this.closed||this.failed)&&!['files','stopped','error'].includes(e.type))return;","if((this.closed||this.failed||this.halted)&&!['files','stopped','error'].includes(e.type))return;")
          edit('src/apps-win32.js',"                this.w.setTitle?.(e.title+' · Win32');","                if(this.closed||this.halted){this.renderer.destroy();return;}\n                this.w.setTitle?.(e.title+' · Win32');")
          edit('src/apps-win32.js',"this.renderer.enqueue(e.commands);if(e.credit){await new Promise(resolve=>requestAnimationFrame(resolve));this.renderer.flush();if(this.renderer.device)await this.renderer.device.queue.onSubmittedWorkDone();this.send({type:'ack',credit:e.credit});}","await this.renderer.submit(e.commands);if(e.credit)this.send({type:'ack',credit:e.credit});")
          edit('src/apps-win32.js','        if(this.stopping)return this.stopping;','        if(this.stopping)return this.stopping;this.halted=true;')
          edit('src/apps-win32.js','});await this.sequence;await this.persist;worker.terminate();',"});worker.terminate();await this.persist;this.nodes.stop.disabled=true;this.nodes.run.disabled=false;this.nodes.sampleRun.disabled=false;if(!this.failed&&this.exitCode===null)this.nodes.phase.textContent='Stopped';")
          edit('src/apps-win32.js','async close(){if(this.closed)return;await this.stop();this.closed=true;this.resize?.disconnect();this.renderer?.destroy();}','async close(){if(this.closed)return;this.closed=true;this.resize?.disconnect();this.renderer?.destroy();await this.stop();}')
          edit('tests/win32/unit.cjs',"await check('No host process, network, COM or Windows installer APIs exist'", """await check('GDI drains do not retain a growing history of completed batch results',async()=>{
           const batches=[],r=await runtime(e=>{if(e.type==='draw'){batches.push(e.commands.length);return Promise.resolve({discardedHostResult:true});}});
           for(let n=0;n<40;n++){r.draw(1,{op:'rect',x:0,y:0,w:1,h:1,color:[1,2,3,255]});assert.equal(await r.flush(),undefined);}
           assert.equal(batches.length,40);assert.equal(r.pendingDraws.size,0);assert.equal(r.drawCount,0);
           return {completedBatches:40,retainedResult:typeof await r.graphicsReady};
          });
          await check('GDI batches enforce the 4096-command ceiling',async()=>{
           const batches=[],r=await runtime(e=>{if(e.type==='draw')batches.push(e.commands.length);});
           for(let n=0;n<4096;n++)r.draw(1,{op:'rect',x:n,y:0,w:1,h:1,color:[1,2,3,255]});
           await r.flush();assert.deepEqual(batches,[4096]);assert.equal(r.drawCount,0);
           r.draw(1,{op:'rect',x:0,y:0,w:1,h:1,color:[1,2,3,255]});await r.flush();assert.deepEqual(batches,[4096,1]);
          });
          await check('No host process, network, COM or Windows installer APIs exist'""")
          edit('tests/win32/browser.py','            def hello():',"""            def no_animation_frames():
                          return page.evaluate(\"\"\"async()=>{const el=document.createElement('div');document.body.append(el);const saved=window.requestAnimationFrame;const g=new AsterGDI(el,64,64,{requireGPU:!!window.ASTER_WIN32_REQUIRE_GPU});try{await g.init();window.requestAnimationFrame=()=>0;for(let n=0;n<40;n++)await g.submit([{op:'rect',x:0,y:0,w:64,h:64,color:[n,34,56,255]}]);const pixel=await g.pixel(10,10);if(pixel.join(',')!=='39,34,56,255')throw Error('Render did not progress without rAF');if(g.pending.length||g.stats().peakQueuedCommands!==1)throw Error('Drawing backlog grew');return g.stats();}finally{window.requestAnimationFrame=saved;g.destroy();el.remove();}}\"\"\")
                      check('Rendering progresses with animation callbacks suspended and stays bounded',no_animation_frames)
                      def hello():""")
          edit('tests/win32/browser.py',"g=page.evaluate('w.win32Session.renderer.stats()');assert g['errors']==[]", "g=page.evaluate('w.win32Session.renderer.stats()');assert g['errors']==[];assert g['peakQueuedCommands']<=4096;assert g['acknowledgedBatches']>0")
          edit('tests/win32/browser.py',"await c.close(true)}');stop();return 'Main desktop responded", "await c.close(true)}');stop();assert page.get_by_role('button',name='Run sample',exact=True).is_enabled();return 'Main desktop responded")
          edit('sw.js',"aster-desktop-1.1.0-win32","aster-desktop-1.1.1-win32")
          staged['docs/browser-win32.md']=Path('docs/browser-win32.md').read_text()+'''\nRender submissions no longer depend on animation callbacks: every Worker credit is acknowledged after direct batch submission and GPU completion, with a timer fallback for scheduled clients. A browser regression suppresses all animation callbacks and verifies 40 batches and their final pixel. Pending commands and peak queue size are exposed in renderer statistics. Completed fence results are discarded rather than retaining historical batch arrays. Stop acknowledgements and file snapshots bypass the graphics queue; a slow renderer cannot prevent Worker termination. The 4,096-command batch limit, private-memory bounds and shader/device limitations remain explicit.\n'''
          for name,text in staged.items():Path(name).write_text(text)
          PY
      - name: Validate runtime, limits and regenerated standalone
        run: |
          for file in src/*.js src/win32/*.js sw.js; do node --check "$file"; done
          python3 -m py_compile tests/win32/browser.py
          node tests/win32/unit.cjs
          node tests/win32/backpressure.cjs
          python3 build.py
      - name: Commit reviewed implementation and remove temporary workflows
        run: |
          rm -f .github/workflows/win32-flow-apply.yml .github/workflows/win32-source-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/apps-win32.js src/win32/gdi.js src/win32/runtime.js tests/win32/unit.cjs tests/win32/browser.py docs/browser-win32.md sw.js Aster.html
          git add -u .github/workflows
          git commit -m 'Keep browser Win32 rendering bounded in background tabs and stop without waiting for GPU fences'
          git push origin HEAD:feat/browser-win32
