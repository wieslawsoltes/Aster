name: Apply verified Win32 flow-control fixes
on:
  push:
    branches: [feat/browser-win32]
    paths: ['.github/workflows/win32-flow-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Decode and verify the original source delta
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, re, subprocess, zlib
          from pathlib import Path
          source=subprocess.check_output(['git','show','ab7e8716beaca00fc6e2e4afd3d938caa41f964f:.github/workflows/win32-flow-apply.yml'],text=True)
          encoded=re.search(r'DELTA: >-\n\s+([^\n]+)',source).group(1).strip()
          assert encoded.count('RYPMSZZOL')==1
          encoded=encoded.replace('RYPMSZZOL','RYPMSZOL')
          raw=zlib.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='225cc2365c438abf268fbc0a7207170bb4504c0dbd3e213582116c599df5e72b'
          changes=json.loads(raw); outputs=[]
          allowed={'docs/browser-win32.md','src/apps-win32.js','src/win32/gdi.js','src/win32/runtime.js','src/win32/worker.js','tests/win32/browser.py','tests/win32/unit.cjs'}
          assert {c['path'] for c in changes}==allowed and len(changes)==len(allowed)
          for change in changes:
              path=Path(change['path']);before=path.read_bytes()
              assert hashlib.sha256(before).hexdigest()==change['before'],'Concurrent modification: '+str(path)
              text=before.decode()
              for op in reversed(change['ops']):
                  assert 0<=op['a']<=op['b']<=len(text)
                  text=text[:op['a']]+op['text']+text[op['b']:]
              after=text.encode()
              assert hashlib.sha256(after).hexdigest()==change['after'],str(path)
              outputs.append((path,after))
          for path,data in outputs:path.write_bytes(data)
          PY
      - name: Validate and build
        run: |
          for file in src/*.js src/win32/*.js sw.js; do node --check "$file"; done
          node tests/win32/unit.cjs
          python3 build.py
      - name: Commit source and remove temporary workflows
        run: |
          rm .github/workflows/win32-flow-apply.yml .github/workflows/win32-source-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/browser-win32.md src/apps-win32.js src/win32/gdi.js src/win32/runtime.js src/win32/worker.js tests/win32/browser.py tests/win32/unit.cjs Aster.html .github/workflows/win32-flow-apply.yml .github/workflows/win32-source-review.yml
          git commit -m 'Backpressure guest rendering, await GPU completion and preserve responsive Stop'
          git push origin HEAD:feat/browser-win32
