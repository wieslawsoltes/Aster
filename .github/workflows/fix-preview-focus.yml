name: Complete preview keyboard focus
on:
  push:
    branches: [feat/adaptive-icons-desktop-preview]
    paths: ['.github/workflows/fix-preview-focus.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact checked keyboard focus correction
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          changes=[
              ('src/desktop-refinement.js','52f08fa5d0d2daa5376414c5ddb125111a9eddb3513ed3a69348a1924bc6a76d','a8e451315d06bd42f4f684d91f15f13bebe68da01685cba2e22be2c9797f60c4',
               'e.preventDefault();nodes[(i+(e.shiftKey?nodes.length-1:1))%nodes.length]?.focus();',
               'e.preventDefault();const next=i<0?(e.shiftKey?nodes.length-1:0):(i+(e.shiftKey?nodes.length-1:1))%nodes.length;nodes[next]?.focus();'),
              ('tests/desktop-refinement/browser.py','6a326069e683b5338902defa28976431f194abfcffa0397fe60379c120e27135','111e85569a9c99f64285eba99bad30d0b2aecaab457e7718222355dd434cf34d',
               "page.screenshot(path=str(out/'quick-preview-text.png'));page.keyboard.press('Escape');",
               '''page.screenshot(path=str(out/'quick-preview-text.png'));page.keyboard.press('Shift+Tab');js('assert(document.activeElement.getAttribute("aria-label")==="Next file");');page.keyboard.press('Tab');js('assert(document.activeElement.textContent==="Open in app");');page.keyboard.press('Escape');''')
          ]
          outputs=[]
          for name,before,after,old,new in changes:
              p=Path(name);data=p.read_bytes();assert hashlib.sha256(data).hexdigest()==before,'Concurrent change: '+name
              text=data.decode();assert text.count(old)==1;data=text.replace(old,new).encode();assert hashlib.sha256(data).hexdigest()==after,name
              outputs.append((p,data))
          for p,data in outputs:p.write_bytes(data)
          PY
      - name: Check production source and reproducible standalone
        run: |
          node --check src/desktop-refinement.js
          python3 -m py_compile tests/desktop-refinement/browser.py
          python3 build.py
          node --test tests/desktop-refinement/models.cjs tests/ui-refinement/models.cjs
          git diff --check
      - name: Commit production correction and browser regression
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/desktop-refinement.js tests/desktop-refinement/browser.py Aster.html
          git commit -m 'Wrap initial Shift+Tab to the last preview control and verify real focus traversal'
          git push origin HEAD:feat/adaptive-icons-desktop-preview
