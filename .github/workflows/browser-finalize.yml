name: Finalize browser Win32 fixes
on:
  push:
    branches: [feat/browser-win32]
    paths: ['.github/workflows/browser-finalize.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Apply source-verified edits and rebuild offline HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, zlib
          packed = ''
          raw = zlib.decompress(base64.b64decode(packed, validate=True))
          assert hashlib.sha256(raw).hexdigest() == 'f0d6c0b5f5cca90966f3434c2883bc6b09128715fd8cfcb7b4ad6b03151c7b77'
          updates = json.loads(raw)
          for update in updates:
              path = Path(update['path'])
              text = path.read_text()
              assert hashlib.sha256(text.encode()).hexdigest() == update['before'], str(path)
              for op in reversed(update['ops']):
                  text = text[:op['start']] + op['text'] + text[op['end']:]
              assert hashlib.sha256(text.encode()).hexdigest() == update['after'], str(path)
              path.write_text(text)
          PY
          for file in src/*.js src/win32/*.js sw.js; do node --check "$file"; done
          python3 build.py
      - name: Commit verified source fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/apps-system.js src/apps-win32.js src/win32/gdi.js README.md tests/win32/browser.py Aster.html
          git commit -m "Fix reserved WGSL sampler name and preserve graphics failure diagnostics"
          git push origin HEAD:feat/browser-win32
