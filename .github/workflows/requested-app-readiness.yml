name: Requested app interactive readiness

on:
  push:
    branches: [ci/requested-app-readiness-september-22]
    paths: [.github/workflows/requested-app-readiness.yml]

permissions:
  contents: read
  actions: write
  pages: read

jobs:
  cleanup:
    name: Retire obsolete workflows without deleting test history
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            if (context.repo.owner !== 'wieslawsoltes' || context.repo.repo !== 'Aster') {
              throw new Error('This cleanup is restricted to wieslawsoltes/Aster.');
            }
            const repo = context.repo;
            const keep = new Set(['.github/workflows/tests.yml', '.github/workflows/pages.yml']);
            const { data: metadata } = await github.rest.repos.get(repo);
            if (metadata.default_branch !== 'main') throw new Error('Unexpected default branch.');
            const { data: mainFiles } = await github.rest.repos.getContent({ ...repo, path: '.github/workflows', ref: 'main' });
            const paths = mainFiles.filter(f => f.type === 'file' && /\.ya?ml$/.test(f.path)).map(f => f.path).sort();
            if (JSON.stringify(paths) !== JSON.stringify([...keep].sort())) {
              throw new Error('Review unexpected main workflow changes before cleanup: ' + JSON.stringify(paths));
            }
            const { data: pages } = await github.rest.repos.getPages(repo);
            console.log('PAGES_CONFIGURATION ' + JSON.stringify({ build_type: pages.build_type, html_url: pages.html_url, source: pages.source }));
            if (pages.build_type !== 'workflow') throw new Error('Pages is not configured for the retained custom workflow.');
            const before = await github.paginate(github.rest.actions.listRepoWorkflows, { ...repo, per_page: 100 });
            const describe = w => ({ id: w.id, name: w.name, path: w.path, state: w.state });
            console.log('WORKFLOWS_BEFORE ' + JSON.stringify(before.map(describe)));
            for (const path of keep) {
              if (!before.some(w => w.path === path && w.state === 'active')) {
                throw new Error('Retained workflow is not active: ' + path);
              }
            }
            const retired = [];
            for (const workflow of before) {
              if (keep.has(workflow.path)) continue;
              if (!workflow.path.startsWith('.github/workflows/')) {
                core.warning('Leaving GitHub-managed workflow unchanged: ' + JSON.stringify(describe(workflow)));
                continue;
              }
              if (workflow.state === 'active') {
                await github.rest.actions.disableWorkflow({ ...repo, workflow_id: workflow.id });
                retired.push(describe(workflow));
              }
              const runs = await github.paginate(github.rest.actions.listWorkflowRuns, { ...repo, workflow_id: workflow.id, per_page: 100 });
              for (const run of runs) {
                if (run.id === context.runId || run.status === 'completed') continue;
                try {
                  await github.rest.actions.cancelWorkflowRun({ ...repo, run_id: run.id });
                  console.log('CANCELLED_OBSOLETE_RUN ' + run.id);
                } catch (error) {
                  if (error.status !== 409) throw error;
                  core.notice('Run completed before cancellation: ' + run.id);
                }
              }
            }
            const branches = await github.paginate(github.rest.repos.listBranches, { ...repo, per_page: 100 });
            const branchFiles = [];
            for (const branch of branches) {
              if (branch.name === 'main' || branch.name === 'gh-pages') continue;
              let files;
              try {
                ({ data: files } = await github.rest.repos.getContent({ ...repo, path: '.github/workflows', ref: branch.name }));
              } catch (error) {
                if (error.status === 404) continue;
                throw error;
              }
              for (const file of files) {
                if (file.type === 'file' && /\.ya?ml$/.test(file.path) && !keep.has(file.path)) {
                  branchFiles.push({ branch: branch.name, path: file.path, sha: file.sha });
                }
              }
            }
            console.log('BRANCH_ONLY_WORKFLOW_FILES ' + JSON.stringify(branchFiles));
            const after = await github.paginate(github.rest.actions.listRepoWorkflows, { ...repo, per_page: 100 });
            console.log('WORKFLOWS_AFTER ' + JSON.stringify(after.map(describe)));
            const active = after.filter(w => w.state === 'active' && w.path.startsWith('.github/workflows/'));
            if (JSON.stringify(active.map(w => w.path).sort()) !== JSON.stringify([...keep].sort())) {
              throw new Error('Unexpected active workflows after cleanup.');
            }
            await core.summary.addHeading('Aster workflow cleanup')
              .addRaw(`Retired ${retired.length} obsolete active workflows. Historical runs and artifacts were retained.\n\n`)
              .addTable([['Active workflow', 'File'], ...active.map(w => [w.name, w.path])])
              .addHeading('Remaining branch-only definitions', 2)
              .addCodeBlock(JSON.stringify(branchFiles, null, 2), 'json')
              .write();
