name: Complete UI sort-readiness verification
on:
  push:
    branches: [fix/theme-controls-original-icons]
    paths: ['.github/workflows/fix-ui-sort-readiness.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Add state-based waits without changing the sort or geometry assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('tests/ui-refinement/browser.py');before=p.read_bytes()
          assert hashlib.sha256(before).hexdigest()=='52ac0310f4deb47a2b29b2499b4989b5278d8bf0cbd5ebe680d5834a1c6fa83e'
          result=[];states=iter(['ascending','descending']);count=0
          for line in before.decode().splitlines(keepends=True):
              result.append(line)
              if "win.get_by_role('button',name='Sort by Date modified',exact=True).click()" in line:
                  state=next(states);count+=1
                  result.append('                page.wait_for_function(\'w.body.querySelectorAll(".file-table th")[1]?.getAttribute("aria-sort")==="'+state+'"\')\n')
          assert count==2
          data=''.join(result).encode()
          assert hashlib.sha256(data).hexdigest()=='fb5ad44e00541d8d7b614e287175d5f19862847c5c07e1ad8cf83e2351895d39'
          p.write_bytes(data)
          PY
          python3 -m py_compile tests/ui-refinement/browser.py
          git diff --check
      - name: Commit only the corrected browser readiness checks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/ui-refinement/browser.py
          git commit -m 'Wait for Explorer IndexedDB sorting before checking accessible header state'
          git push origin HEAD:fix/theme-controls-original-icons
