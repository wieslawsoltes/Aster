name: Import shell launch source
on:
  push:
    branches: [feat/shell-launch-workflows]
    paths: ['.github/workflows/import-shell-launch.yml']
permissions:
  contents: write
concurrency:
  group: import-shell-launch
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify every input and output in the bounded source delta
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, json, lzma
          encoded=''.join(Path(f'.transfer/launch-{i}.b64').read_text().strip() for i in range(3))
          assert len(encoded)==29616
          compressed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='6ea8036af533d1c6be8532bb7ec7ad143121079b55ba49f4c94b9c197a3d3051'
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=decoder.decompress(compressed,max_length=73953)
          assert decoder.eof and not decoder.unused_data and len(raw)==73952
          assert hashlib.sha256(raw).hexdigest()=='b9de93fe768dce9b7ea3cd082b48ab9cfd8a6fbc883e33dcaa165597c6c8698b'
          changes=json.loads(raw)
          allowed={'.gitignore','README.md','docs/shell-launch.md','index.html','src/apps-creative.js','src/apps-files.js','src/core.js','src/integrated-desktop.js','src/shell-command-models.js','src/shell-experience.js','src/shell-launch.css','src/shell-launch.js','src/shell.js','sw.js','tests/shell-launch/README.md','tests/shell-launch/browser.py','tests/shell-launch/models.cjs'}
          assert len(changes)==17 and {c['path'] for c in changes}==allowed
          outputs=[]
          for c in changes:
              path=PurePosixPath(c['path']);p=Path(path)
              assert not path.is_absolute() and '..' not in path.parts and not p.is_symlink()
              if c['before'] is None:
                  assert not p.exists(),str(p)
                  data=c['content'].encode('utf-8')
              else:
                  before=p.read_bytes()
                  assert hashlib.sha256(before).hexdigest()==c['before'],'Concurrent change: '+str(p)
                  text=before.decode('utf-8');last=0
                  for a,b,value in c['ops']:
                      assert last<=a<=b<=len(text) and isinstance(value,str)
                      last=b
                  for a,b,value in reversed(c['ops']):text=text[:a]+value+text[b:]
                  data=text.encode('utf-8')
              assert hashlib.sha256(data).hexdigest()==c['after'],str(p)
              outputs.append((p,data))
          for p,data in outputs:p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          print('Verified all 17 editable source paths.')
          PY
      - name: Build offline edition and check models and inherited contracts
        run: |
          for file in src/*.js; do node --check "$file"; done
          python3 -m py_compile tests/shell-launch/browser.py
          python3 build.py
          node --test tests/shell-launch/models.cjs tests/file-workflows/models.cjs tests/integrated-shell/contracts.cjs tests/desktop-features/models.cjs tests/web-apps/catalog.cjs
          git diff --check
      - name: Commit sources without rewriting workflow files
        run: |
          rm -rf .transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Integrate Open with, default apps, Run, Jump Lists, startup and recent privacy'
          git push origin HEAD:feat/shell-launch-workflows
