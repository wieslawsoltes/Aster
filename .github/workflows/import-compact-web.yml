name: Import compact web app source
on:
  push:
    branches: [feat/compact-web-apps]
    paths: ['.github/workflows/import-compact-web.yml']
permissions:
  contents: write
concurrency:
  group: import-compact-web
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify complete bounded delta and every source input and output
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, json, lzma
          encoded=''.join(Path(f'.transfer/compact-{i}.b64').read_text().strip() for i in range(3))
          assert len(encoded)==23312
          compressed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='527a4e056b3dc4b938779265175a1615da5b69b36c5c9f4b2d77a8361e2661e7'
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=decoder.decompress(compressed,max_length=55546)
          assert decoder.eof and not decoder.unused_data and len(raw)==55545
          assert hashlib.sha256(raw).hexdigest()=='7311ca07eee60b5c5d3b8615c1204e25a5fe923aea66acce957512b39b4ebed1'
          changes=json.loads(raw)
          allowed={'.gitignore','README.md','docs/compact-web-apps.md','docs/web-apps.md','index.html','src/apps-files.js','src/apps-web.js','src/core.js','src/shell-command-models.js','src/shell-launch.js','src/web-app-chrome.css','src/web-app-settings.js','src/web-navigation.js','src/windows.js','sw.js','tests/web-apps/browser.py','tests/web-chrome/browser.py','tests/web-chrome/models.cjs'}
          assert len(changes)==18 and {c['path'] for c in changes}==allowed
          outputs=[]
          for c in changes:
              path=PurePosixPath(c['path']);p=Path(path)
              assert not path.is_absolute() and '..' not in path.parts and not p.is_symlink()
              if c['before'] is None:
                  assert not p.exists(),str(p)
                  data=c['content'].encode('utf-8')
              else:
                  before=p.read_bytes()
                  assert hashlib.sha256(before).hexdigest()==c['before'],'Concurrent change: '+str(p)
                  text=before.decode('utf-8');last=0
                  for a,b,value in c['ops']:
                      assert isinstance(a,int) and isinstance(b,int) and last<=a<=b<=len(text) and isinstance(value,str)
                      last=b
                  for a,b,value in reversed(c['ops']):text=text[:a]+value+text[b:]
                  data=text.encode('utf-8')
              assert hashlib.sha256(data).hexdigest()==c['after'],str(p)
              outputs.append((p,data))
          for p,data in outputs:p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          print('Verified all 18 editable source paths.')
          PY
      - name: Validate source, navigation boundaries and inherited contracts
        run: |
          for file in src/*.js; do node --check "$file"; done
          python3 -m py_compile tests/web-chrome/browser.py tests/web-apps/browser.py
          python3 build.py
          node --test tests/web-chrome/models.cjs tests/themes/models.cjs tests/themes/win32.cjs tests/shell-launch/models.cjs tests/file-workflows/models.cjs tests/integrated-shell/contracts.cjs tests/desktop-features/models.cjs tests/web-apps/catalog.cjs
          git diff --check
      - name: Commit sources to the feature branch
        run: |
          rm -rf .transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Hide web-app host chrome by default and integrate secure Orbit navigation'
          git push origin HEAD:feat/compact-web-apps
