name: Finish theme lifecycle integration
on:
  push:
    branches: [feat/theme-system]
    paths: ['.github/workflows/fix-theme-lifecycle.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact reviewed lifecycle fix and regression
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          def edit(name,before,after,pairs):
              p=Path(name);data=p.read_bytes()
              assert hashlib.sha256(data).hexdigest()==before,'Concurrent edit: '+name
              text=data.decode()
              for old,new in pairs:
                  assert text.count(old)==1,(name,old)
                  text=text.replace(old,new)
              data=text.encode();assert hashlib.sha256(data).hexdigest()==after,name
              p.write_bytes(data)
          edit('src/theme-shell.js','a731eb9a600887bfa798069e87ab942e3b5f8101083deab60072c77ba46565c0','2880cd151b50c44f6a04b0df85bbde7661c1dd1c16a7e36f51f9bb324baa2b01',[
              ('    const OS=Aster,$=OS.$;','    const OS=Aster,$=OS.$;\n    let lastShellLayout=null;\n    const shellLayout=()=>JSON.stringify(OS.themes.chrome);'),
              ("        const t=OS.themes.chrome,profile=t.profile,center=bar.querySelector('.task-center');if(!center)return;","        const t=OS.themes.chrome,profile=t.profile,center=bar.querySelector('.task-center');if(!center)return;\n        if(lastShellLayout===null)lastShellLayout=shellLayout();"),
              ("    OS.on('theme-change',()=>{OS.closePanels?.();OS.decorateTaskbar($('#taskbar'));});","    OS.on('theme-change',()=>{\n        // Legacy color settings persist asynchronously. Do not dismiss a newly\n        // opened flyout merely because that color-only transaction completed.\n        // Dock/profile changes invalidate anchors; those still dismiss panels.\n        const next=shellLayout();\n        if(lastShellLayout!==null&&lastShellLayout!==next)OS.closePanels?.();\n        lastShellLayout=next;OS.decorateTaskbar($('#taskbar'));\n    });")
          ])
          replacement='''            def legacy_flyout():
                          js('window.colorRevision=OS.themes.revision;await OS.setSetting("theme","dark");OS.showWidgets();window.colorFlyout=document.querySelector(".widgets-flyout");window.colorWindows=OS.windows.size;')
                          page.wait_for_function('Aster.themes.revision>colorRevision')
                          js('await OS.themes.pending;assert(colorFlyout?.isConnected);assert(document.querySelector(".widgets-flyout")===colorFlyout);assert(OS.windows.size===colorWindows);assert(document.body.dataset.theme==="dark");')
                          page.locator('.widgets-flyout textarea').wait_for()
                          js('OS.closePanels();await OS.themes.select("windows-light");')
                          return 'The actual deferred legacy color save preserves the same open Widget flyout'
                      check('Color-only theme persistence does not dismiss a newly opened shell flyout',legacy_flyout)
                      def profiles():'''
          lines=replacement.splitlines();replacement=lines[0]+'\n'+'\n'.join(line[10:] for line in lines[1:])
          edit('tests/themes/browser.py','9580bc56376d285f7711b7ed187a3871a24430ef5045a64b1b1d9f96128c9d32','845ab092b1ec824b61d370e80576f62dd52e265c119d78d767808d0557e1bcdc',[
              ('            def profiles():',replacement)
          ])
          PY
      - name: Validate original assertions and rebuild standalone
        run: |
          node --check src/theme-shell.js
          python3 -m py_compile tests/themes/browser.py
          python3 build.py
          node --test tests/themes/models.cjs tests/themes/win32.cjs tests/integrated-shell/contracts.cjs
          git diff --check
      - name: Commit the production fix and regression on the existing branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/theme-shell.js tests/themes/browser.py Aster.html
          git commit -m 'Keep shell flyouts alive during color-only theme persistence'
          git push origin HEAD:feat/theme-system
