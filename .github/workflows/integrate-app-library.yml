name: Integrate reviewed local app library
on:
  push:
    branches: [feat/local-app-library]
    paths: ['.github/workflows/integrate-app-library.yml']
permissions:
  contents: write
concurrency:
  group: integrate-app-library-source
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all staged bytes and outputs before changing source
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, json, zlib
          parts=[Path(f'.transfer/library-{i}.b64').read_text().strip() for i in range(6)]
          # Repair the independently identified single-character transfer transcription.
          assert parts[3].count('AhG03Wk9ifTXu')==1
          parts[3]=parts[3].replace('AhG03Wk9ifTXu','AhG03Hk9ifTXu')
          expected=['35217748320c60382c5cf72e95778cc0ea22c902','7c18cca64d2ad07b266c4ea2c3572b2f3ecd5a6f','a74958a7afe79eaa72e4e02ddb6a23785109bd48','bb91fda751c5fcce0717d429e9c93e23fefc11e5','d30510d1ad0573cab074fe22371c5887dd73cd78','92250fa29ac2a82f0cd3d742d6ab0f71ba414e59']
          for text,digest in zip(parts,expected):
              data=text.encode();assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==digest
          encoded=''.join(parts);assert len(encoded)==38628
          data=base64.b64decode(encoded,validate=True)
          assert len(data)==28970 and hashlib.sha256(data).hexdigest()=='5ae72575cc277108a33a090deac8debe312fbb3a503ec9735533dc99cea01c86'
          decoder=zlib.decompressobj(31);raw=decoder.decompress(data,93104)
          assert decoder.eof and not decoder.unused_data and len(raw)==93103
          assert hashlib.sha256(raw).hexdigest()=='d7b931927036e5256d6b0c6967c211dd6ddd0749ec0fa275e2845bbe62935398'
          changes=json.loads(raw)
          allowed={'.gitignore','README.md','docs/app-library.md','index.html','src/app-library-models.js','src/app-library.js','src/app-store.css','src/app-store.js','src/apps-creative.js','src/apps-system.js','src/core.js','src/desktop-refinement.js','src/profile-artwork.js','src/shell-experience.js','src/shell.js','src/web-app-settings.js','sw.js','tests/app-library/README.md','tests/app-library/browser.py','tests/app-library/models.cjs'}
          assert len(changes)==20 and {c['path'] for c in changes}==allowed
          outputs=[]
          for c in changes:
              path=PurePosixPath(c['path']);p=Path(path)
              assert not path.is_absolute() and '..' not in path.parts and not p.is_symlink()
              if c['before'] is None:
                  assert not p.exists(),str(p)
                  result=c['content'].encode('utf-8')
              else:
                  before=p.read_bytes();assert hashlib.sha256(before).hexdigest()==c['before'],'Concurrent source change: '+str(p)
                  text=before.decode('utf-8');last=0
                  for a,b,value in c['ops']:
                      assert isinstance(a,int) and isinstance(b,int) and last<=a<=b<=len(text) and isinstance(value,str)
                      last=b
                  for a,b,value in reversed(c['ops']):text=text[:a]+value+text[b:]
                  result=text.encode('utf-8')
              assert hashlib.sha256(result).hexdigest()==c['after'],'Output mismatch: '+str(p)
              outputs.append((p,result))
          for p,result in outputs:p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(result)
          print('All 20 source files match the reviewed local source exactly.')
          PY
      - name: Build and validate source and inherited contracts
        run: |
          for f in src/*.js sw.js; do node --check "$f"; done
          python3 -m py_compile tests/app-library/browser.py
          node --test tests/*/models.cjs tests/integrated-shell/contracts.cjs tests/web-apps/catalog.cjs
          python3 build.py
          git diff --exit-code -- sdk/aster-files.js
          git diff --check
      - name: Commit integrated source and remove transfer files
        run: |
          rm -rf .transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all -- . ':!.github'
          git commit -m 'Add local App Center library, editable descriptions and atomic HTML package management'
          git push origin HEAD:feat/local-app-library
      - name: Preserve exact resulting source for recovery and comparison
        if: always()
        run: |
          mkdir -p /tmp/library-source
          git archive --format=zip HEAD -o /tmp/library-source/source.zip
          git rev-parse HEAD > /tmp/library-source/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-library-integrated-source
          path: /tmp/library-source/
          retention-days: 14
