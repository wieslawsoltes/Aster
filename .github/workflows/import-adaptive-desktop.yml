name: Complete adaptive desktop verification
on:
  push:
    branches: [feat/adaptive-icons-desktop-preview]
    paths: ['.github/workflows/import-adaptive-desktop.yml']
permissions:
  contents: write
concurrency:
  group: import-adaptive-desktop
  cancel-in-progress: false
jobs:
  complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply two hash-checked bounds and regression edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          changes=[
              ('src/desktop-refinement.js','a5f3b30727f352e3c76613f4a793fc24834b4f6af3be3b7892d2df81542e2666','52f08fa5d0d2daa5376414c5ddb125111a9eddb3513ed3a69348a1924bc6a76d',11487,11487,
               "                // The file may have been replaced after stat; bound actual bytes too.\n                if(kind!=='text'&&blob.size>M.PREVIEW_LIMIT){body.replaceChildren(message('Media previews are limited to 16 MiB. The original file is unchanged.'));return;}\n"),
              ('tests/desktop-refinement/browser.py','925f3cef720b686d9e32c04c189c3be30772cce2244572f71baa967d30a1351a','6a326069e683b5338902defa28976431f194abfcffa0397fe60379c120e27135',16611,16715,
               '                # Pause real metadata lookup, then replace the actual stored file.\n'
               '                js(\'window.originalStat=OS.fs.stat;window.releaseStat=null;OS.fs.stat=async function(path){const entry=await originalStat.call(this,path);if(path.endsWith("h.png"))await new Promise(r=>releaseStat=r);return entry;};window.racedPreview=OS.previewFiles(["/Documents/Preview/h.png"],0,w);\')\n'
               '                page.wait_for_function(\'!!releaseStat\')\n'
               '                js(\'OS.fs.stat=originalStat;await OS.fs.write("/Documents/Preview/h.png",new Blob([new Uint8Array(16777217)],{type:"image/png"}),"image/png");releaseStat();await racedPreview;assert(OS.quickPreview.liveURLs===0);\')\n'
               "                page.get_by_text('Media previews are limited to 16 MiB.',exact=False).wait_for();page.keyboard.press('Escape')\n"
               "                return 'Corrupt media is freed; metadata and actual byte-size limits hold even after concurrent replacement'\n")
          ]
          outputs=[]
          for name,before,after,a,b,replacement in changes:
              p=Path(name);raw=p.read_bytes();assert hashlib.sha256(raw).hexdigest()==before,'Concurrent change: '+name
              text=raw.decode('utf-8');assert 0<=a<=b<=len(text)
              data=(text[:a]+replacement+text[b:]).encode('utf-8');assert hashlib.sha256(data).hexdigest()==after,name
              outputs.append((p,data))
          for p,data in outputs:p.write_bytes(data)
          PY
      - name: Validate and rebuild the checked standalone
        run: |
          node --check src/desktop-refinement.js
          python3 -m py_compile tests/desktop-refinement/browser.py
          python3 build.py
          node --test tests/desktop-refinement/models.cjs tests/ui-refinement/models.cjs
          git diff --check
      - name: Commit completed source before full browser verification
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/desktop-refinement.js tests/desktop-refinement/browser.py Aster.html
          git commit -m 'Recheck actual preview bytes after metadata lookup and test concurrent replacement'
          git push origin HEAD:feat/adaptive-icons-desktop-preview
