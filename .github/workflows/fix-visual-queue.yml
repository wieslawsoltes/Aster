name: Apply checked visual queue fix
on:
  push:
    branches: [feat/profile-fidelity-glass]
    paths: ['.github/workflows/fix-visual-queue.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all source inputs and outputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma
          encoded=''
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=decoder.decompress(base64.b64decode(encoded,validate=True),max_length=5175)
          assert decoder.eof and not decoder.unused_data and len(raw)==5174
          assert hashlib.sha256(raw).hexdigest()=='cd3c99bcd5d8967fc0683960edf0852c0e659babe1b638eef535821e098d30f5'
          changes=json.loads(raw)
          assert {c['path'] for c in changes}=={'src/renderer.js','src/liquid-material.js','tests/visual-materials/browser.py','tests/visual-materials/models.cjs','docs/visual-materials.md','tests/visual-materials/README.md'} and len(changes)==6
          outputs=[]
          for c in changes:
              p=Path(c['path']);before=p.read_bytes();assert hashlib.sha256(before).hexdigest()==c['before'],str(p)
              text=before.decode();last=0
              for a,b,value in c['ops']:assert last<=a<=b<=len(text);last=b
              for a,b,value in reversed(c['ops']):text=text[:a]+value+text[b:]
              data=text.encode();assert hashlib.sha256(data).hexdigest()==c['after'],str(p)
              outputs.append((p,data))
          for p,data in outputs:p.write_bytes(data)
          PY
      - name: Verify queue regression and all inherited models, then rebuild
        run: |
          for f in src/*.js src/win32/*.js; do node --check "$f"; done
          python3 -m py_compile tests/visual-materials/browser.py
          python3 build.py
          node --test tests/visual-materials/models.cjs tests/themes/models.cjs tests/themes/win32.cjs tests/web-chrome/models.cjs tests/shell-launch/models.cjs tests/file-workflows/models.cjs tests/integrated-shell/contracts.cjs tests/desktop-features/models.cjs tests/web-apps/catalog.cjs
          git diff --check
      - name: Commit production queue bound and diagnostic regression
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/renderer.js src/liquid-material.js tests/visual-materials/ docs/visual-materials.md Aster.html
          git commit -m 'Bound shared GPU frame backlog and retain dirty state for interactive optical work'
          git push origin HEAD:feat/profile-fidelity-glass
