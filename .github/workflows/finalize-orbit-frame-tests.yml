name: Finalize cross-engine Orbit frame tests
on:
  push:
    branches: [fix/orbit-webviews]
    paths: ['.github/workflows/finalize-orbit-frame-tests.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - name: Validate both test changes before writing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          changes=json.loads(r'''[{"path":"tests/orbit/browser.py","before":"bec0e9b418e66f8681b793aabbdf2893c6226ea3f94b4a9306fd4d255f100b6e","after":"94b6217abc8f61fa96034cf54f544079e1720b851fed1fa58a8ee70a17d42db6","ops":[[948,987,"            if '/denied-xfo' in self.path:\n                self.send_header('X-Frame-Options','DENY')\n            elif '/denied' in self.path:\n"],[3251,3251,"                report['status']='FAIL';(out/'results.json').write_text(json.dumps(report,indent=2))\n"],[22356,23078,"                        evidence=[]\n                        for endpoint,firefox_error,header,value in [\n                            ('denied','NS_ERROR_CSP_FRAME_ANCESTOR_VIOLATION','content-security-policy',\"frame-ancestors 'none'\"),\n                            ('denied-xfo','NS_ERROR_XFO_VIOLATION','x-frame-options','DENY')\n                        ]:\n                            target=origin+'/orbit-fixture/'+endpoint\n                            # A denied Firefox document may have no usable automation execution\n                            # context. Require the browser's actual navigation-refusal event;\n                            # never evaluate a locator inside its privileged error document.\n                            with ctx.expect_event('requestfailed',predicate=lambda r:r.url==target and r.is_navigation_request(),timeout=15000) as refused:\n                                w=launch({'url':target,'mode':'webview'})\n                            failure=refused.value.failure\n                            expected=firefox_error if args.engine=='firefox' else 'net::ERR_BLOCKED_BY_RESPONSE'\n                            assert failure and failure.startswith(expected),(target,failure)\n                            page.wait_for_function('b.getWebview().snapshot.status===\"unverified\"')\n                            assert js('return b.getWebview().snapshot.reportedURL;')==''\n                            assert 'allow-same-origin' not in w.locator('iframe').get_attribute('sandbox')\n                            assert w.get_by_role('button',name='Page not visible?').is_visible()\n                            with ctx.expect_event('response',predicate=lambda r:r.url==target,timeout=15000) as response:\n                                with ctx.expect_page() as popup:w.get_by_role('link',name='Open in browser ↗').click()\n                            remote=popup.value;remote.get_by_role('heading',name='Orbit fixture document').wait_for()\n                            assert remote.evaluate('opener===null')\n                            assert response.value.status==200 and response.value.headers.get(header)==value\n                            if endpoint=='denied-xfo':assert 'content-security-policy' not in response.value.headers\n                            evidence.append({'policy':header,'value':value,'browserRefusal':failure,'externalTitle':remote.title()})\n                            remote.close()\n                        return evidence\n                    check('Real CSP and independent XFO denial stay enforced while external fallback displays each document',denied)\n"]]},{"path":"tests/orbit/README.md","before":"f8dc94acc64fccf6ad56324963b68aacaaef58adf03b4cb848ef8c0235342fc3","after":"e19e5c05d50cb92b37f702f8e80d0d6bbbea2ac07d7c87075221bc6fee545c03","ops":[[3311,3311,"\n### Cross-engine frame-policy regression\n\nA Firefox run reached the real denied frame but stalled while trying to inspect\nthe browser-generated error document. Denial verification now requires the\nbrowser's actual `requestfailed` navigation event and exact policy error, then\nchecks that the unmodified response opens through the external link with no opener.\nCSP frame-ancestors and X-Frame-Options-only responses are exercised independently;\nordinary allowed HTTP webviews still prove real rendering, isolation and SDK updates.\nNo browser, policy or fallback assertion is skipped. The complete driver process is\nbounded separately from in-page promises, and failures preserve their report first.\n"]]}]''')
          assert len(changes)==2 and {c['path'] for c in changes}=={'tests/orbit/browser.py','tests/orbit/README.md'}
          outputs=[]
          for c in changes:
              p=Path(c['path']);before=p.read_bytes()
              assert hashlib.sha256(before).hexdigest()==c['before'],'Concurrent change: '+str(p)
              text=before.decode('utf-8');last=0
              for a,b,value in c['ops']:
                  assert last<=a<=b<=len(text);last=b
              for a,b,value in reversed(c['ops']):text=text[:a]+value+text[b:]
              result=text.encode('utf-8');assert hashlib.sha256(result).hexdigest()==c['after'],'Output mismatch: '+str(p)
              outputs.append((p,result))
          for p,result in outputs:p.write_bytes(result)
          PY
          python3 -m py_compile tests/orbit/browser.py
          git diff --check
      - name: Commit only verified tests and documentation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/orbit/browser.py tests/orbit/README.md
          git commit -m 'Require real browser CSP and XFO refusal plus successful unchanged external fallback'
          git push origin HEAD:fix/orbit-webviews
