name: Diagnose Firefox app draft preservation
on:
  push:
    branches: [feat/local-app-library]
    paths: ['.github/workflows/diagnose-library-drafts.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install independent Firefox
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps firefox
      - name: Instrument only the test observation points; preserve all assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/app-library/browser.py');s=p.read_text()
          s=s.replace("page=context.new_page();", "context.tracing.start(screenshots=True,snapshots=True,sources=True);page=context.new_page();")
          s=s.replace("(out/'report.json').write_text", "context.tracing.stop(path=str(out/'trace.zip'));(out/'report.json').write_text")
          start=s.index('            def editing():');end=s.index("            check('Editing name",start)
          block=s[start:end]
          block=block.replace("f=page.locator('.app-frame').element_handle().content_frame();", "f=page.locator('.app-frame').element_handle().content_frame();f.evaluate('window.draftStamp=crypto.randomUUID();window.draftEvents=[];document.addEventListener(\"input\",e=>draftEvents.push({id:e.target.id,value:e.target.value,type:e.inputType}));');print('INITIAL',f.evaluate('({stamp:window.draftStamp,value:document.querySelector(\"textarea\").value})'),flush=True);")
          block=block.replace("f.locator('#check').click();", "print('AFTER_FILL',f.evaluate('({stamp:window.draftStamp,value:document.querySelector(\"textarea\").value,events:window.draftEvents})'),flush=True);f.locator('#check').click();print('AFTER_CLICK',f.evaluate('({stamp:window.draftStamp,value:document.querySelector(\"textarea\").value,events:window.draftEvents})'),flush=True);")
          block=block.replace("details(app);page.get_by_role", "details(app);print('AFTER_DETAILS',f.evaluate('({stamp:window.draftStamp,value:document.querySelector(\"textarea\").value,events:window.draftEvents})'),flush=True);page.get_by_role")
          block=block.replace("d.get_by_role('button',name='Save changes',exact=True).click();", "print('BEFORE_SAVE',f.evaluate('({stamp:window.draftStamp,value:document.querySelector(\"textarea\").value,events:window.draftEvents})'),flush=True);d.get_by_role('button',name='Save changes',exact=True).click();")
          block=block.replace("assert f.get_by_label('Draft').input_value()", "print('AFTER_SAVE',f.evaluate('({stamp:window.draftStamp,value:document.querySelector(\"textarea\").value,events:window.draftEvents})'),flush=True);assert f.get_by_label('Draft').input_value()")
          s=s[:start]+block+s[end:];p.write_text(s)
          PY
          python tests/app-library/browser.py --engine firefox --output tests/app-library/artifacts/draft-diagnostics 2>&1 | tee /tmp/draft-diagnostics.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firefox-draft-diagnostics
          path: |
            tests/app-library/artifacts/draft-diagnostics/
            /tmp/draft-diagnostics.log
          retention-days: 14
