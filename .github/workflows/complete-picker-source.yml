name: Complete profile file picker source
on:
  push:
    branches: [feat/profile-file-pickers]
    paths: ['.github/workflows/complete-picker-source.yml']
permissions:
  contents: write
concurrency:
  group: complete-picker-source
  cancel-in-progress: false
jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the complete bounded source delta before writing any file
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, json, lzma
          encoded=''.join(Path(f'.transfer/complete-{i}.b64').read_text().strip() for i in range(6))
          assert len(encoded)==38264
          data=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(data).hexdigest()=='d9c372255d0f1eb2557fce93e10a12074aace1ad423d1e7e5a21d3fb39623bfe'
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=decoder.decompress(data,max_length=110246)
          assert decoder.eof and not decoder.unused_data and len(raw)==110245
          assert hashlib.sha256(raw).hexdigest()=='1ea8d2173f8eda815448a2fd518b817a2ab3ea2884a2c4697938ea16d751e0c2'
          changes=json.loads(raw)
          allowed={'.gitignore','README.md','index.html','src/core.js','src/web-io-host.js','src/web-io.css','sw.js','docs/file-pickers.md','src/file-picker-models.js','src/file-picker.css','src/file-picker.js','tests/file-pickers/models.cjs','tests/file-pickers/browser.py','tests/file-pickers/README.md','tests/web-io/review_checks.py'}
          assert len(changes)==15 and {c['path'] for c in changes}==allowed
          outputs=[]
          for c in changes:
              path=PurePosixPath(c['path']);p=Path(path)
              assert not path.is_absolute() and '..' not in path.parts and not p.is_symlink()
              if c['before'] is None:
                  assert not p.exists(),str(p)
                  result=c['content'].encode('utf-8')
              else:
                  before=p.read_bytes()
                  assert hashlib.sha256(before).hexdigest()==c['before'],'Concurrent change: '+str(p)
                  text=before.decode('utf-8');last=0
                  for a,b,value in c['ops']:
                      assert isinstance(a,int) and isinstance(b,int) and last<=a<=b<=len(text) and isinstance(value,str)
                      last=b
                  for a,b,value in reversed(c['ops']):text=text[:a]+value+text[b:]
                  result=text.encode('utf-8')
              assert hashlib.sha256(result).hexdigest()==c['after'],'Output mismatch: '+str(p)
              outputs.append((p,result))
          for p,result in outputs:
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(result)
          print('All 15 editable source paths verified and written.')
          PY
      - name: Build and validate the complete source and inherited contracts
        run: |
          for f in src/*.js; do node --check "$f"; done
          python3 -m py_compile tests/file-pickers/browser.py tests/web-io/review_checks.py
          python3 build.py
          node --test tests/*/models.cjs tests/integrated-shell/contracts.cjs tests/web-apps/catalog.cjs
          git diff --check
      - name: Commit source and remove staging without rewriting workflow files
        run: |
          rm -rf .transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Integrate profile-adaptive file pickers, accessible navigation and bounded previews'
          git push origin HEAD:feat/profile-file-pickers
      - name: Preserve recoverable source on failure
        if: failure()
        run: |
          mkdir -p /tmp/picker-diagnostics
          tar --exclude=.git --exclude=.transfer -czf /tmp/picker-diagnostics/source.tar.gz .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: picker-integration-diagnostics
          path: /tmp/picker-diagnostics/
          retention-days: 14
