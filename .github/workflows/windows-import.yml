name: Import verified Windows companion source
on:
  push:
    branches: [feat/windows-apps-bridge]
    paths: ['.windows-bootstrap/ready']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/windows-apps-bridge
      - name: Verify and apply original source files
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, json, lzma, shutil
          folder = Path('.windows-bootstrap')
          data = base64.b64decode(''.join((folder / f'part-{i}.b64').read_text().strip() for i in range(5)), validate=True)
          expected = '006c1b952dffafef3e0eb0f50d62a90d4ebca63ce586cf97cfde84fa1d3c0d09'
          assert hashlib.sha256(data).hexdigest() == expected, 'Transfer checksum mismatch'
          payload = json.loads(lzma.decompress(data))
          output = dict(payload['new'])
          for name in output:
              assert not Path(name).exists(), f'New file already exists: {name}'
          for name, edit in payload['edit'].items():
              raw = Path(name).read_bytes()
              digest = hashlib.sha1(f'blob {len(raw)}\0'.encode() + raw).hexdigest()
              assert digest == edit['old_sha'], f'Base file changed: {name}'
              text = raw.decode()
              for start, end, replacement in reversed(edit['hunks']):
                  text = text[:start] + replacement + text[end:]
              output[name] = text
          assert set(output) == set(payload['sha256'])
          for name, text in output.items():
              path = PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert not name.startswith('.github/'), 'Workflows are installed separately'
              assert hashlib.sha256(text.encode()).hexdigest() == payload['sha256'][name], name
          for name, text in output.items():
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text)
          shutil.rmtree(folder)
          print(f'Imported {len(output)} checksum-verified files.')
          PY
      - name: Validate and rebuild the standalone desktop
        run: |
          for file in src/*.js bridge/client/*.js sw.js; do node --check "$file"; done
          python3 -m py_compile bridge/*.py tests/windows/*.py
          python3 build.py
      - name: Commit expanded application source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Implement real Windows apps through native Wine companion and authenticated Aster streaming"
          git push origin HEAD:feat/windows-apps-bridge
