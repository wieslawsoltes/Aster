name: Finish native file clipboard
on:
  push:
    branches: [fix/clipboard-keyboard]
    paths: ['.github/workflows/finish-file-clipboard.yml']
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the complete source delta before writing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          changes=json.loads(r'''[{"path":"src/apps-files.js","before":"9cbdd6bfca56607bfc987bc770259f0858872e8680921013ad2923c845dded52","after":"40c2c65b3f9b4f2ec6a8919b0adfbc3c66a1438d379525e044d521d343786531","ops":[[43689,43689,"                // A file selection is not a DOM text selection. Request a real Copy\n                // transaction on the key gesture so engines that omit the empty-\n                // selection copy event still receive the paths and native marker.\n                if(OS.input.primary(e)&&!e.shiftKey&&['c','x'].includes(e.key.toLowerCase())&&path!=='/.Trash'){e.preventDefault();copy(e.key.toLowerCase()==='x');return;}\n"]]},{"path":"sw.js","before":"4818e5d657b5eeccb1c9bfec4af6dc4043d2afefe5bc91538fa4b639390e257e","after":"ec1811b669462378f3eacd6a9b9c96f32df0a60c73d7450b7a33241bc9a5ecff","ops":[[58,59,"4"]]},{"path":"tests/clipboard/README.md","before":"7001caa36d8762cbf969ae2420f650fe7416d9e07b6c630d423ee58184d61739","after":"34a3f1f1f2673c6961eda55084afd7d6a23761a74cfc3eb4deec2a8f2eb47408","ops":[[5015,5015,"\nFile-list Copy/Cut starts a real native Copy transaction on the key gesture. A\nselected virtual file is not a DOM text selection; relying only on an otherwise\nempty browser Copy event left the file clipboard unset in hosted Firefox. Text\ninputs remain on the browser's native editing path. The cross-browser test still\nuses real Copy/Paste keys, requires actual bytes at the destination, and rejects\nstale internal paths after a different page changes the system clipboard.\n"]]},{"path":"tests/clipboard/browser.py","before":"dfd97b8572c3faeba03edddc95c58e378b1d44cc56c0a3e9985a472735597111","after":"d545517686d948c9da11a3ffe72fa8e2d23397c9d47ce0367e7ef128e8b67366","ops":[[17047,17089,"?.paths[0]===\"/Documents/Clipboard test.txt\",\"File-copy gesture did not publish its selection"]]}]''')
          assert len(changes)==4 and {c['path'] for c in changes}=={'src/apps-files.js','sw.js','tests/clipboard/README.md','tests/clipboard/browser.py'}
          outputs=[]
          for c in changes:
              p=Path(c['path']);assert not p.is_symlink()
              before=p.read_bytes();assert hashlib.sha256(before).hexdigest()==c['before'],'Concurrent change: '+str(p)
              text=before.decode('utf-8');last=0
              for a,b,value in c['ops']:
                  assert isinstance(a,int) and isinstance(b,int) and last<=a<=b<=len(text) and isinstance(value,str);last=b
              for a,b,value in reversed(c['ops']):text=text[:a]+value+text[b:]
              result=text.encode('utf-8');assert hashlib.sha256(result).hexdigest()==c['after'],'Output mismatch: '+str(p)
              outputs.append((p,result))
          for p,result in outputs:p.write_bytes(result)
          PY
      - name: Validate source and exact standalone
        run: |
          for f in src/*.js sdk/*.js sw.js; do node --check "$f"; done
          python3 -m py_compile tests/clipboard/browser.py
          node --test tests/*/models.cjs tests/integrated-shell/contracts.cjs tests/web-apps/catalog.cjs
          python3 build.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          b=Path('Aster.html').read_bytes()
          assert len(b)==6082446 and hashlib.sha256(b).hexdigest()=='c536d010483a0b748c00d33537580c16308afabfbb07aa4caae94a3fd9c2b9f9'
          PY
          git diff --exit-code -- sdk/aster-files.js sdk/aster-clipboard.js tests/results.json
          git diff --check
      - name: Commit verified file clipboard source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Aster.html src/apps-files.js sw.js tests/clipboard/README.md tests/clipboard/browser.py
          git commit -m 'Write real native file clipboard data on Copy and Cut gestures without hijacking text fields'
          git push origin HEAD:fix/clipboard-keyboard
