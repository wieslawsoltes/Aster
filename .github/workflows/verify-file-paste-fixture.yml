name: Verify final clipboard and input repairs
on:
  push:
    branches: [fix/clipboard-keyboard]
    paths: ['.github/workflows/verify-file-paste-fixture.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and apply exact reviewed edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,base64,zlib
          encoded=''
          # Preserve the exact reviewed payload despite a transport-only spelling correction.
          encoded=encoded.replace('BQHTbhcmkXfPnbar','BQHTbhcmXfPnbar')
          data=base64.b64decode(encoded,validate=True)
          assert len(data)==2799 and hashlib.sha256(data).hexdigest()=='57c8a5801d6eb414dd3958dc01309002c63069a4b48c38ef0905d6f78eca4653'
          decoder=zlib.decompressobj();raw=decoder.decompress(data,6282)
          assert decoder.eof and not decoder.unused_data and len(raw)==6281 and hashlib.sha256(raw).hexdigest()=='2ba4917915ae1ca868b101d52e703af1beb492bfe9a28c34591151a5e59825d5'
          changes=json.loads(raw)
          allowed={'tests/clipboard/browser.py','tests/clipboard/README.md','src/apps-browser.js','sw.js','tests/win32/gui-browser.py','docs/clipboard.md'}
          assert len(changes)==6 and {c['path'] for c in changes}==allowed
          outputs=[]
          for c in changes:
              p=Path(c['path']);before=p.read_bytes();assert not p.is_symlink() and hashlib.sha256(before).hexdigest()==c['before'],str(p)
              text=before.decode();last=0
              for a,b,value in c['ops']:
                  assert last<=a<=b<=len(text);last=b
              for a,b,value in reversed(c['ops']):text=text[:a]+value+text[b:]
              result=text.encode();assert hashlib.sha256(result).hexdigest()==c['after'],str(p)
              outputs.append((p,result))
          for p,result in outputs:p.write_bytes(result)
          PY
      - name: Check source, models and reproducible standalone
        run: |
          for f in src/*.js sdk/*.js sw.js; do node --check "$f"; done
          python -m py_compile tests/clipboard/browser.py tests/win32/gui-browser.py
          node --test tests/*/models.cjs tests/integrated-shell/contracts.cjs tests/web-apps/catalog.cjs
          python build.py
          echo '3188ed6c4d5ec3bc1db51d16844371e9269bfc3b27ad0174a1787708e1983287  Aster.html' | sha256sum -c -
          git diff --exit-code -- sdk/aster-files.js sdk/aster-clipboard.js tests/results.json
          git diff --check
      - name: Install independent Firefox
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps firefox
      - name: Native clipboard and explicitly labeled supplied-file fixture
        run: timeout 300s python -u tests/clipboard/browser.py --engine firefox --output tests/clipboard/artifacts/firefox-fixture
      - name: Commit only after full Firefox suite passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/clipboard/browser.py tests/clipboard/README.md src/apps-browser.js sw.js tests/win32/gui-browser.py docs/clipboard.md Aster.html
          git commit -m 'Preserve pasted Orbit drafts and verify supplied-file imports across browser engines'
          git push origin HEAD:fix/clipboard-keyboard
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-file-paste-verification
          path: tests/clipboard/artifacts/firefox-fixture/
          retention-days: 7
