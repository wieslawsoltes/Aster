name: Browser Win32 — PE32 execution and WebGPU

on:
  pull_request:
    paths:
      - 'src/**'
      - 'native/win32/**'
      - 'examples/win32/**'
      - 'tests/**'
      - 'index.html'
      - 'build.py'
      - '.github/workflows/browser-win32.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-win32-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build and browser test tools only — no Windows runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 libvulkan1 mesa-vulkan-drivers xvfb xauth
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Validate the shipped CPU and PE32 programs
        run: |
          for file in src/*.js src/win32/*.js sw.js; do node --check "$file"; done
          node tests/win32/unit.cjs
          python build.py
          xvfb-run -a -s '-screen 0 1440x1000x24' python tests/win32/browser.py --gpu --headed
          cp tests/win32/artifacts/browser-results.json tests/win32/artifacts/browser-shipped-results.json
          cp tests/win32/artifacts/unit-results.json tests/win32/artifacts/unit-shipped-results.json
      - name: Rebuild CPU and examples from source and repeat the tests
        env:
          CLANG: clang-18
          LLD_LINK: lld-link-18
          LLVM_AR: llvm-ar-18
        run: |
          python native/win32/build.py
          node tests/win32/unit.cjs
          python build.py
          xvfb-run -a -s '-screen 0 1440x1000x24' python tests/win32/browser.py --gpu --headed
      - name: Regress the browser desktop
        run: python tests/smoke.py
      - name: Retain reports, genuine screenshots, and offline standalone HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-win32-evidence
          path: |
            tests/win32/artifacts/
            tests/results.json
            Aster.html
          retention-days: 14

  native-reference:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify the unchanged sample is also an actual Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tests/win32/native-artifacts | Out-Null
          $exe = (Resolve-Path src/win32/examples/compute.exe).Path
          $directory = (Resolve-Path tests/win32/native-artifacts).Path
          $process = Start-Process -FilePath $exe -WorkingDirectory $directory -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Native EXE exit code: $($process.ExitCode)" }
          $text = [IO.File]::ReadAllText((Join-Path $directory 'checksum.txt'))
          if ($text -ne "4248471154`n") { throw "Unexpected native checksum: $text" }
          @{ executable = 'compute.exe'; sha256 = (Get-FileHash $exe -Algorithm SHA256).Hash; exitCode = $process.ExitCode; checksum = $text.Trim(); host = 'Native Windows'; note = 'The identical PE32 fixture also runs in the browser; this host is test-only, not an application dependency.' } | ConvertTo-Json | Set-Content (Join-Path $directory 'native-reference.json')
      - uses: actions/upload-artifact@v4
        with:
          name: browser-win32-native-reference
          path: tests/win32/native-artifacts/
          retention-days: 14
