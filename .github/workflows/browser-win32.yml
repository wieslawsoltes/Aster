name: Browser Win32 — PE32 execution and WebGPU

on:
  pull_request:
    paths:
      - 'src/**'
      - 'native/win32/**'
      - 'examples/win32/**'
      - 'tests/**'
      - 'third-party/**'
      - 'docs/**'
      - 'Aster.html'
      - 'index.html'
      - 'build.py'
      - 'sw.js'
      - '.github/workflows/browser-win32.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-win32-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve the exact tested source and binary provenance
        run: |
          mkdir -p tests/win32/artifacts
          git archive --format=zip HEAD -o tests/win32/artifacts/Aster-source.zip
          python3 - <<'PY'
          import hashlib, json, os, subprocess
          from pathlib import Path
          paths = [Path('Aster.html'), Path('src/win32/x86.wasm'), *sorted(Path('src/win32/examples').glob('*.exe')), *sorted(Path('src/win32/third-party').glob('*'))]
          data = {'checkedOutCommit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'pullRequestHead': os.environ.get('PR_HEAD', ''), 'sha256': {str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in paths}}
          Path('tests/win32/artifacts/provenance.json').write_text(json.dumps(data, indent=2) + '\n')
          PY
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
      - name: Install build and browser test tools only — no Windows runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 llvm-18 libvulkan1 mesa-vulkan-drivers xvfb xauth
          python -m pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Validate the shipped CPU and PE32 programs
        run: |
          for file in src/*.js src/win32/*.js sw.js; do node --check "$file"; done
          node tests/win32/unit.cjs
          node tests/win32/exports.cjs --check
          node tests/win32/compat.cjs
          node tests/win32/backpressure.cjs
          node tests/win32/gui.cjs
          python build.py
          git diff --exit-code -- Aster.html
          cp Aster.html tests/win32/artifacts/Aster-shipped.html
          xvfb-run -a -s '-screen 0 1440x1000x24' python tests/win32/browser.py --gpu --headed
          xvfb-run -a -s '-screen 0 1440x1000x24' python tests/win32/gui-browser.py --gpu --headed
          cp tests/win32/artifacts/browser-results.json tests/win32/artifacts/browser-shipped-results.json
          cp tests/win32/artifacts/unit-results.json tests/win32/artifacts/unit-shipped-results.json
          cp -R tests/win32/artifacts/gui tests/win32/artifacts/gui-shipped
          cp tests/win32/artifacts/compat/results.json tests/win32/artifacts/compat-shipped-results.json
          xvfb-run -a -s '-screen 0 1440x1000x24' python tests/win32/apps-browser.py --gpu --headed
          xvfb-run -a -s '-screen 0 1440x1000x24' python tests/win32/apps-browser.py --gpu --headed --standalone --output tests/win32/artifacts/standalone-apps
      - name: Rebuild CPU and examples from source and repeat the tests
        env:
          CLANG: clang-18
          LLD_LINK: lld-link-18
          LLVM_AR: llvm-ar-18
        run: |
          python native/win32/build.py
          node tests/win32/unit.cjs
          node tests/win32/exports.cjs --check
          node tests/win32/compat.cjs
          node tests/win32/backpressure.cjs
          node tests/win32/gui.cjs
          python build.py
          xvfb-run -a -s '-screen 0 1440x1000x24' python tests/win32/browser.py --gpu --headed
          xvfb-run -a -s '-screen 0 1440x1000x24' python tests/win32/gui-browser.py --gpu --headed
      - name: Regress the browser desktop
        run: python tests/smoke.py
      - name: Retain reports, genuine screenshots, and offline standalone HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-win32-evidence
          path: |
            tests/win32/artifacts/
            tests/results.json
            Aster.html
          retention-days: 14

  native-reference:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify the unchanged sample is also an actual Windows executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tests/win32/native-artifacts | Out-Null
          $exe = (Resolve-Path src/win32/examples/compute.exe).Path
          $directory = (Resolve-Path tests/win32/native-artifacts).Path
          $process = Start-Process -FilePath $exe -WorkingDirectory $directory -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Native EXE exit code: $($process.ExitCode)" }
          $text = [IO.File]::ReadAllText((Join-Path $directory 'checksum.txt'))
          if ($text -ne "4248471154`n") { throw "Unexpected native checksum: $text" }
          @{ executable = 'compute.exe'; sha256 = (Get-FileHash $exe -Algorithm SHA256).Hash; exitCode = $process.ExitCode; checksum = $text.Trim(); host = 'Native Windows'; note = 'The identical PE32 fixture also runs in the browser; this host is test-only, not an application dependency.' } | ConvertTo-Json | Set-Content (Join-Path $directory 'native-reference.json')
      - uses: actions/upload-artifact@v4
        with:
          name: browser-win32-native-reference
          path: tests/win32/native-artifacts/
          retention-days: 14

  upstream-native-cross-check:
    needs: browser
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: browser-win32-evidence
          path: _browser-evidence
      - name: Native Windows validates browser-created archives and compiler output
        run: python tests/win32/native-apps.py --evidence _browser-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-win32-native-cross-check
          path: tests/win32/native-artifacts/
          retention-days: 14

  gui-native-reference:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Execute the identical WineMine EXE with native Windows menus and dialogs
        run: python tests/win32/native-gui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win32-gui-native-reference
          path: tests/win32/native-artifacts/native-gui.json
          retention-days: 14

  gui-reproducible-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install maintainer-only cross compiler (not the Wine runtime)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686 binutils-mingw-w64-i686
      - name: Rebuild the original gameplay offline from bundled corresponding source
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import zipfile
          source=Path('/tmp/aster-winemine-source')
          with zipfile.ZipFile('third-party/winemine/winemine-source.zip') as archive:
              assert sum(i.file_size for i in archive.infolist()) < 2*1024*1024
              for info in archive.infolist():
                  p=PurePosixPath(info.filename)
                  assert not p.is_absolute() and '..' not in p.parts and not info.is_dir()
                  out=source/p;out.parent.mkdir(parents=True,exist_ok=True);out.write_bytes(archive.read(info))
          PY
          python3 third-party/winemine/build.py --source /tmp/aster-winemine-source --output tests/win32/artifacts/winemine-rebuilt
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          original=Path('src/win32/third-party/winemine.exe').read_bytes()
          rebuilt=Path('tests/win32/artifacts/winemine-rebuilt/winemine.exe').read_bytes()
          assert original==rebuilt, 'WineMine binary differs from pinned source rebuild'
          sha=hashlib.sha256(rebuilt).hexdigest()
          assert sha==json.loads(Path('third-party/winemine/provenance.json').read_text())['sha256']['winemine.exe']
          Path('tests/win32/artifacts/winemine-rebuilt/reproducibility.json').write_text(json.dumps({'status':'PASS','binarySHA256':sha,'byteIdentical':True}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: win32-gui-rebuilt-source
          path: tests/win32/artifacts/winemine-rebuilt/
          retention-days: 14
