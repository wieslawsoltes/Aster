name: Finalize app library regressions
on:
  push:
    branches: [feat/local-app-library]
    paths: ['.github/workflows/finalize-app-library.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate every before and after hash before writing source
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, json
          changes=json.loads(r'''[{"path":"docs/app-library.md","before":"1959240bd5089416a246adbc0acc105073ff9035827286a4a551aaa20854dafa","after":"0e769bf0ecb1fda5a612aa9760039c38a532271e49c0aa0bd63fad218379bb58","ops":[[2289,2365,"metadata and, for HTML apps, their UTF-8 source text. Other character encodings\nshould be converted to UTF-8 before installation. Import always\n"]]},{"path":"src/app-library.js","before":"b9db7eee64129a867cf4fd8901726d576f43d1e0be7bd80577884a7d02ca1bd5","after":"182c2981c16cff34b5a67b101acf491fe7d04afe0c819a4f44eca99445e8dbea","ops":[[357,484,"    const conflict = () => { throw Error('The app library or source changed elsewhere. Preserve your drafts, reload the older tab, and try again.'); };\n"]]},{"path":"src/apps-system.js","before":"8602dca6801d5c667e1612a8ca50928f277168325fe817d19b3a55d3f4346f94","after":"947b6305626ab19dd0a512d55d715037d730833ab440e4dab3bf9f72ac1481de","ops":[[1119,1439,"        const backup = { format: 'aster-desktop-backup', version: 1, createdAt: new Date().toISOString(), settings: OS.settings, files: packed, tasks: await OS.db.get('tasks') || [], calendarEvents: await OS.db.get('calendarEvents') || [], customApps: (await OS.db.get('customApps')) ?? OS.customApps, worldCities: await OS.db.get('worldCities') || [] };\n"]]},{"path":"sw.js","before":"d4c78ef2ac1889962eb42e3efe0552829b2cde07308fe6e338e030ab162108bd","after":"68a97dfaf1780b24ec22bbed494d9bb58344e4b627824ffe027030019a785397","ops":[[14,64,"const CACHE = 'aster-desktop-2.2-app-library-r2';\n"]]},{"path":"tests/app-library/README.md","before":"1bbfdc77d31817ff1a3f7818135a62bc3a3018404b2e8e7ae3a6730d95dd2393","after":"8835bd014191d70402fed22aa22a832f6a564038b37fdf94cd954870d0ebce03","ops":[[1541,1541,"\n## Hosted regressions and diagnostic boundaries\n\nThe first Firefox trace showed that `fill()` alone on a newly launched inactive\niframe did not enter text: the value stayed `Original` with no input event, and\nthe document identity did not change. The regression now clicks the actual editor\nfirst and asserts the exact draft immediately, before opening app details, and\nagain after metadata edits and source replacement. No DOM text setter, forced\nclick or replacement app implementation is used.\n\nThe first Chromium run passed the real IndexedDB abort, reload and migration\nchecks but observed registry removal before the separate shell pin queues\nfinished. The test waits for all three required removals, then additionally\nchecks the saved `taskbarPins` and `startPins` records. The inherited Widgets test\nlikewise waits for its asynchronously rebuilt task card to exist before checking\nits contents; absence is not accepted as task completion.\n\nDesktop backup checks operate real Settings export/restore controls and native\nfile choosers. They restore descriptions, favorite and artwork metadata and actual\nHTML contents after changing them. A malformed legacy record remains inert but\nis retained in the exported recovery backup before an explicit normalized edit.\n"]]},{"path":"tests/app-library/browser.py","before":"673702007a05c76a64942651795d99f4f1c23d27e84f9c2abdfa5571318fe93a","after":"b9a562f6ddb0654bd63e818263432b5bc1e15f17cd398e17f4682a1e712334c3","ops":[[7249,7458,"                f=page.locator('.app-frame').element_handle().content_frame();f.get_by_label('Draft').click();f.get_by_label('Draft').fill('Keep unsaved Ω text');assert f.get_by_label('Draft').input_value()=='Keep unsaved Ω text','Draft entry failed before any metadata edit';f.locator('#check').click();assert f.locator('output').inner_text()=='Working'\n"],[8000,8291,"                assert f.get_by_label('Draft').input_value()=='Keep unsaved Ω text','Metadata editing changed the guest draft';js('assert(originalFrame===running.body.querySelector(\"iframe\"));assert(running.title===\"Engineering desk Ω\");assert(OS.appLibrary.get(arg).color===\"teal\");assert(OS.appIcon(arg).includes(\"#258980\"));',app)\n"],[20104,20104,"            def backup_roundtrip():\n                cleanup();expected=js('return OS.appLibrary.get(arg);',app)\n                js('window.backupSettings=OS.launch(\"settings\",{section:\"recovery\"});await backupSettings.ready;')\n                with page.expect_download() as download:page.get_by_role('button',name='Export backup',exact=True).click()\n                file=out/'desktop-backup.json';download.value.save_as(file);packed=json.loads(file.read_text())\n                assert next(r for r in packed['customApps'] if r['id']==app)==expected\n                js('const r=OS.appLibrary.get(arg);await OS.fs.write(r.path,\"Source changed after export\",\"text/html\");await OS.appLibrary.save({...r,description:\"Changed after export\",favorite:false},r.revision);',app)\n                with page.expect_file_chooser() as chooser:page.get_by_role('button',name='Restore backup',exact=True).click()\n                chooser.value.set_files(str(file));form('Restore Aster backup?').get_by_role('button',name='Restore',exact=True).click()\n                page.wait_for_function('id=>Aster.appLibrary.get(id)?.description===\"Mobile draft\"&&Aster.appLibrary.get(id).favorite===true',arg=app)\n                actual=js('return OS.appLibrary.get(arg);',app)\n                for key in ['id','kind','title','description','category','icon','color','publisher','version','favorite','path']:assert actual[key]==expected[key],key\n                assert js('return await OS.fs.text(await OS.fs.read(arg));',expected['path'])==SOURCE2\n                js('await backupSettings.close(true);');focus_store()\n            check('Real desktop backup restores edited app metadata and the actual HTML package',backup_roundtrip)\n"],[21637,22560,"                    js('await OS.fs.write(\"/Projects/legacy.html\",arg,\"text/html\");const apps=await OS.db.get(\"customApps\");apps.push({id:\"custom-legacy\",title:\"Legacy install\",path:\"/Projects/legacy.html\"},{id:\"files\",title:\"Rejected raw record\",path:\"/Projects/legacy.html\",description:\"Recoverable metadata\"});await OS.db.set(\"customApps\",apps);',SOURCE);page.reload();page.wait_for_function('Aster.booted');r=js('return OS.appLibrary.get(\"custom-legacy\");');assert r['description']=='Your sandboxed HTML application';assert r['path']=='/Projects/legacy.html'\n                    js('assert(OS.appLibrary.rejected.length===1);assert(!OS.apps.get(\"files\").custom);window.recovery=OS.launch(\"settings\",{section:\"recovery\"});await recovery.ready;')\n                    with page.expect_download() as download:page.get_by_role('button',name='Export backup',exact=True).click()\n                    file=out/'legacy-recovery-backup.json';download.value.save_as(file);raw=json.loads(file.read_text())\n                    assert any(r.get('id')=='files' and r.get('description')=='Recoverable metadata' for r in raw['customApps'])\n                    js('await recovery.close(true);');focus_store();details('custom-legacy');page.get_by_role('button',name='Edit details',exact=True).click();d=form('Edit app details');d.get_by_label('Description',exact=True).fill('Updated legacy description');d.get_by_role('button',name='Save changes',exact=True).click();d.wait_for(state='detached');page.reload();page.wait_for_function('Aster.booted');assert js('return OS.appLibrary.get(\"custom-legacy\").description;')=='Updated legacy description';focus_store()\n"],[23051,23535,"                cleanup();details(app);old=js('return OS.appLibrary.get(arg).path;',app);page.get_by_role('button',name='Remove app',exact=True).click();form('Remove Engineering desk Ω?').get_by_role('button',name='Remove',exact=True).click();page.wait_for_function('id=>!Aster.apps.has(id)&&!Aster.pins.includes(id)&&!Aster.startPins.includes(id)',arg=app);js('assert(!OS.customApps.some(a=>a.id===arg));assert(!OS.pins.includes(arg));assert(!OS.startPins.includes(arg));assert(!(await OS.db.get(\"taskbarPins\")||[]).includes(arg));assert(!(await OS.db.get(\"startPins\")||[]).includes(arg));',app);assert js('return (await OS.fs.stat(arg)).kind;',old)=='file'\n"]]},{"path":"tests/desktop-features/browser.py","before":"b7d3af34cd58eff2588c8201f097bb37a921d5b10bc8a1fc534560d1434eb55d","after":"644d36ea73b23063f9ac379ed1ff1719f0f8d25e98e1a605bf5173c42cd30806","ops":[[13636,13773,"                page.wait_for_function(\"(()=>{const n=document.querySelector('[data-widget=tasks]');return !!n&&!n.textContent.includes('Complete through widget');})()\")\n"]]}]''')
          allowed={'docs/app-library.md','src/app-library.js','src/apps-system.js','sw.js','tests/app-library/README.md','tests/app-library/browser.py','tests/desktop-features/browser.py'}
          assert len(changes)==7 and {c['path'] for c in changes}==allowed
          outputs=[]
          for c in changes:
              path=PurePosixPath(c['path']);p=Path(path)
              assert not path.is_absolute() and '..' not in path.parts and not p.is_symlink()
              before=p.read_bytes();assert hashlib.sha256(before).hexdigest()==c['before'],'Concurrent source change: '+str(p)
              text=before.decode('utf-8');last=0
              for a,b,value in c['ops']:
                  assert isinstance(a,int) and isinstance(b,int) and last<=a<=b<=len(text) and isinstance(value,str)
                  last=b
              for a,b,value in reversed(c['ops']):text=text[:a]+value+text[b:]
              result=text.encode('utf-8');assert hashlib.sha256(result).hexdigest()==c['after'],'Output mismatch: '+str(p)
              outputs.append((p,result))
          for p,result in outputs:p.write_bytes(result)
          PY
      - name: Rebuild and verify the actual source
        run: |
          for f in src/*.js sw.js; do node --check "$f"; done
          python3 -m py_compile tests/app-library/browser.py tests/desktop-features/browser.py
          node --test tests/*/models.cjs tests/integrated-shell/contracts.cjs tests/web-apps/catalog.cjs
          python3 build.py
          git diff --exit-code -- sdk/aster-files.js
          git diff --check
      - name: Commit verified fixes and tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Aster.html docs/app-library.md src/app-library.js src/apps-system.js sw.js tests/app-library/README.md tests/app-library/browser.py tests/desktop-features/browser.py
          git commit -m 'Retain raw legacy metadata in backups and verify real draft entry and completed pin cleanup'
          git push origin HEAD:feat/local-app-library
