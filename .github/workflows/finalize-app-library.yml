name: Finalize app library regressions
on:
  push:
    branches: [feat/local-app-library]
    paths: ['.github/workflows/finalize-app-library.yml']
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate every source change before writing
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, json
          changes=json.loads(r'''[{"path":"src/app-library.js","before":"182c2981c16cff34b5a67b101acf491fe7d04afe0c819a4f44eca99445e8dbea","after":"56401c4b5bf8d32298120b3ad40ecbfecb2d01ded3b6b45a7f1cd2b0db597da2","ops":[[10559,10559,"        OS.refreshIconArtwork?.(r.id);\n"]]},{"path":"src/profile-artwork.js","before":"7e2c5d58bc1af51beea1cb389f6fe3c0d86bdb84c4a313619ca6f2ab03eea50d","after":"cfecf04be11742552fd0cbbfd876ad0f830ca6f967215bf3e789e20763d1bd30","ops":[[14901,14933,"    OS.refreshIconArtwork=(appId=null)=>{\n"],[15081,15138,"            if(appId ? node.dataset.iconId!==appId : node.dataset.iconFamily===which)continue;\n"]]},{"path":"sw.js","before":"68a97dfaf1780b24ec22bbed494d9bb58344e4b627824ffe027030019a785397","after":"38ed832bf95ff75ad2418235e33cd088723d30341b113e1a87392c6fa19b4be8","ops":[[14,64,"const CACHE = 'aster-desktop-2.2-app-library-r3';\n"]]},{"path":"tests/app-library/README.md","before":"8835bd014191d70402fed22aa22a832f6a564038b37fdf94cd954870d0ebce03","after":"dceb0b52099860807956c086864078c9278b8bd913c60587b536f11f3e3ea039","ops":[[2811,2811,"\nThe inherited desktop smoke suite now opens the real installer form through App\nCenter and the browser file chooser, rather than waiting on an obsolete mocked\nsingle-name prompt. Its sandbox assertions remain, and it also checks the saved\ndescription. Editing artwork refreshes vector children in the original running\ncaption icon node; a browser regression checks both its identity and new color.\n"]]},{"path":"tests/app-library/browser.py","before":"b9a562f6ddb0654bd63e818263432b5bc1e15f17cd398e17f4682a1e712334c3","after":"f5b9d47803f2a37a56de082b2856c64d5959e01106e9bd418c6396f456077f29","ops":[[7114,7249,"                js('window.running=OS.launch(arg);await running.ready;window.originalFrame=running.body.querySelector(\"iframe\");window.originalCaptionIcon=running.titleEl.firstElementChild;',app)\n"],[8146,8480,"                assert f.get_by_label('Draft').input_value()=='Keep unsaved Ω text','Metadata editing changed the guest draft';js('assert(originalFrame===running.body.querySelector(\"iframe\"));assert(running.title===\"Engineering desk Ω\");assert(OS.appLibrary.get(arg).color===\"teal\");assert(OS.appIcon(arg).includes(\"#258980\"));assert(originalCaptionIcon===running.titleEl.firstElementChild);assert(originalCaptionIcon.style.getPropertyValue(\"--art-base\")==\"#258980\");',app)\n"]]},{"path":"tests/smoke.py","before":"55b216359d8a2f6da468e649becb3204d0c439956fc86bea1db3b08d14206c60","after":"8872debb3e66328f92ce942595869f1e8defd09bde8254466a98ab976ab29301","ops":[[18920,19574,"            await launch('store')\n            source='<!doctype html><button onclick=\"this.textContent=42\">Run</button>'\n            async with page.expect_file_chooser() as chooser:\n                await page.get_by_role('button',name='Install HTML app',exact=True).click()\n            await (await chooser.value).set_files({'name':'Test App.html','mimeType':'text/html','buffer':source.encode()})\n            dialog=page.get_by_role('dialog',name='Install HTML app',exact=True)\n            await dialog.get_by_label('App name',exact=True).fill('Test App')\n            await dialog.get_by_label('Description',exact=True).fill('Smoke-installed app description')\n            await dialog.get_by_role('button',name='Install',exact=True).click()\n            await dialog.wait_for(state='detached')\n            return await js(\"const app=OS.customApps.find(a=>a.title==='Test App');assert(app);assert(app.description==='Smoke-installed app description');const w=OS.launch(app.id);await w.ready;window.testWindow=w;assert(w.body.querySelector('iframe').sandbox.contains('allow-scripts'));assert(!w.body.querySelector('iframe').sandbox.contains('allow-same-origin'));return app.id;\")\n"]]}]''')
          allowed={'src/app-library.js','src/profile-artwork.js','sw.js','tests/app-library/README.md','tests/app-library/browser.py','tests/smoke.py'}
          assert len(changes)==6 and {c['path'] for c in changes}==allowed
          outputs=[]
          for c in changes:
              path=PurePosixPath(c['path']);p=Path(path)
              assert not path.is_absolute() and '..' not in path.parts and not p.is_symlink()
              before=p.read_bytes();assert hashlib.sha256(before).hexdigest()==c['before'],'Concurrent source change: '+str(p)
              text=before.decode('utf-8');last=0
              for a,b,value in c['ops']:
                  assert isinstance(a,int) and isinstance(b,int) and last<=a<=b<=len(text) and isinstance(value,str)
                  last=b
              for a,b,value in reversed(c['ops']):text=text[:a]+value+text[b:]
              result=text.encode('utf-8');assert hashlib.sha256(result).hexdigest()==c['after'],'Output mismatch: '+str(p)
              outputs.append((p,result))
          for p,result in outputs:p.write_bytes(result)
          PY
      - name: Rebuild and verify the actual source
        run: |
          for f in src/*.js sw.js; do node --check "$f"; done
          python3 -m py_compile tests/app-library/browser.py tests/smoke.py
          node --test tests/*/models.cjs tests/integrated-shell/contracts.cjs tests/web-apps/catalog.cjs
          python3 build.py
          git diff --exit-code -- sdk/aster-files.js
          git diff --check
      - name: Commit verified source and tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Aster.html src/app-library.js src/profile-artwork.js sw.js tests/app-library/README.md tests/app-library/browser.py tests/smoke.py
          git commit -m 'Refresh edited caption artwork in place and exercise the real installer in desktop smoke tests'
          git push origin HEAD:feat/local-app-library
