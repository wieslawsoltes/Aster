name: Synchronize desktop regression events
on:
  push:
    branches: [feat/browser-win32]
    paths: ['.github/workflows/win32-smoke-sync.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Remove fixed-delay assumptions without weakening assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/smoke.py');s=p.read_text()
          old='''            # Trigger save without awaiting the pending dialog promise.
                      await page.evaluate("void testWindow.save()")
                      d=page.get_by_role('dialog');await d.locator('input').fill('/Pictures/Test drawing.png');await d.get_by_role('button',name='Save',exact=True).click()
                      await page.wait_for_timeout(180)'''
          new='''            # Start Save, answer its dialog, then await the actual file operation.
                      await page.evaluate("()=>{window.paintSaveOperation=testWindow.save();}")
                      d=page.get_by_role('dialog');await d.locator('input').fill('/Pictures/Test drawing.png');await d.get_by_role('button',name='Save',exact=True).click()
                      await page.evaluate('window.paintSaveOperation')'''
          assert s.count(old)==1;s=s.replace(old,new)
          old="            await clean();await page.set_viewport_size({'width':390,'height':844});await page.evaluate('Aster.toggleStart()');await page.wait_for_timeout(100)"
          new='''            await clean()
                      # A resize dismisses panels. Observe that real event before clicking Start.
                      await page.evaluate("()=>{window.testResizeObserved=false;window.addEventListener('resize',()=>{window.testResizeObserved=true;},{once:true});}")
                      await page.set_viewport_size({'width':390,'height':844})
                      await page.wait_for_function('window.testResizeObserved && innerWidth===390')
                      await page.evaluate('new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)))')
                      await page.locator('#start-button').click()
                      await page.locator('.start-menu').wait_for(state='visible')'''
          assert s.count(old)==1;s=s.replace(old,new)
          q=Path('src/core.js');core=q.read_text();old='Aster does not execute EXE/MSI files, emulate a Windows kernel, or give websites unrestricted access to your computer.'
          new='Win32 Lab executes a limited subset of 32-bit Windows EXEs locally in your browser. Aster does not emulate a Windows kernel, support MSI installers, or give guest programs unrestricted access to your computer.'
          assert core.count(old)==1;core=core.replace(old,new)
          p.write_text(s);q.write_text(core)
          PY
      - name: Check tests and rebuild the standalone edition
        run: |
          python3 -m py_compile tests/smoke.py
          node --check src/core.js
          python3 build.py
      - name: Commit and remove the temporary workflow
        run: |
          rm .github/workflows/win32-smoke-sync.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/smoke.py src/core.js Aster.html
          git add -u .github/workflows
          git commit -m 'Await real desktop save/resize completion and clarify seeded Win32 compatibility guidance'
          git push origin HEAD:feat/browser-win32
