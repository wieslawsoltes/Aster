name: Native Orbit desktop
on:
  push:
    branches: [main, build/native-orbit]
  pull_request:
    paths: ['desktop/**', 'src/**', 'tests/native-browser/**', 'index.html', 'Aster.html', '.github/workflows/desktop.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Chromium desktop and sandbox dependencies
        run: |
          npm ci --prefix desktop
          sudo apt-get update -qq
          sudo apt-get install -y xvfb imagemagick libgtk-3-0t64 libasound2t64 libgbm1
          sudo chown root:root desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 desktop/node_modules/electron/dist/chrome-sandbox
      - name: Actual internal Chromium, CSP/XFO controls, input and live Google
        run: xvfb-run -a -s '-screen 0 1600x1100x24' env ASTER_LIVE=1 npm test --prefix desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-orbit-linux-evidence
          path: tests/native-browser/artifacts/
          retention-days: 14
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Models, source and reproducible standalone
        run: |
          for f in src/*.js desktop/*.cjs tests/native-browser/*.cjs; do node --check "$f"; done
          node --test tests/*/models.cjs tests/integrated-shell/contracts.cjs tests/web-apps/catalog.cjs
          python build.py
          git diff --exit-code -- Aster.html sdk/aster-files.js sdk/aster-clipboard.js
          git diff --check
      - name: Browser-hosted regression tools
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Preserve ordinary web browsing, clipboard and standalone operation
        run: |
          python tests/orbit/browser.py --output tests/native-browser/artifacts/web-orbit
          python tests/orbit/browser.py --standalone --output tests/native-browser/artifacts/web-standalone
          python tests/clipboard/browser.py --output tests/native-browser/artifacts/clipboard
          python tests/web-chrome/browser.py --output tests/native-browser/artifacts/compact
      - name: Exact source provenance
        if: always()
        run: |
          mkdir -p tests/native-browser/artifacts
          git archive --format=zip HEAD -o tests/native-browser/artifacts/source.zip
          git rev-parse HEAD > tests/native-browser/artifacts/commit.txt
          sha256sum Aster.html > tests/native-browser/artifacts/standalone.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-orbit-web-regressions
          path: tests/native-browser/artifacts/
          retention-days: 14
  package:
    needs: [native, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win32
            arch: x64
          - os: macos-15-intel
            platform: darwin
            arch: x64
          - os: macos-15
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build unsigned desktop bundle
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_ARCH: ${{ matrix.arch }}
        run: |
          npm ci --prefix desktop
          npm run package --prefix desktop
      - name: Archive preserving executable modes and symlinks
        shell: bash
        run: tar -czf "Aster-Desktop-${{ matrix.platform }}-${{ matrix.arch }}.tar.gz" -C desktop/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: Aster-Desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: Aster-Desktop-*.tar.gz
          retention-days: 30
