name: Apply verified material readiness fix
on:
  push:
    branches: [feat/profile-fidelity-glass]
    paths: ['.github/workflows/fix-material-ready.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify each reviewed source change before writing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,lzma
          encoded=''
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=decoder.decompress(base64.b64decode(encoded,validate=True),max_length=1897)
          assert decoder.eof and not decoder.unused_data and len(raw)==1896
          assert hashlib.sha256(raw).hexdigest()=='461654a558472f57c5a94aa92131eb94cff46edce1e1a3554f6cdf079abd6634'
          changes=json.loads(raw)
          assert len(changes)==3 and {c['path'] for c in changes}=={'src/liquid-material.js','tests/visual-materials/browser.py','tests/visual-materials/README.md'}
          outputs=[]
          for c in changes:
              p=Path(c['path']);before=p.read_bytes();assert hashlib.sha256(before).hexdigest()==c['before'],str(p)
              text=before.decode();last=0
              for a,b,value in c['ops']:assert last<=a<=b<=len(text);last=b
              for a,b,value in reversed(c['ops']):text=text[:a]+value+text[b:]
              data=text.encode();assert hashlib.sha256(data).hexdigest()==c['after'],str(p)
              outputs.append((p,data))
          for p,data in outputs:p.write_bytes(data)
          PY
      - name: Rebuild and retain all optical, theme and shell assertions
        run: |
          node --check src/liquid-material.js
          python3 -m py_compile tests/visual-materials/browser.py
          python3 build.py
          node --test tests/visual-materials/models.cjs tests/themes/models.cjs tests/themes/win32.cjs tests/integrated-shell/contracts.cjs
          git diff --check
      - name: Commit readiness and its visible tests on the existing PR
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/liquid-material.js tests/visual-materials/ Aster.html
          git commit -m 'Include scheduled reconciliation and visible surfaces in material readiness'
          git push origin HEAD:feat/profile-fidelity-glass
