name: Finish recovered profile picker source
on:
  push:
    branches: [feat/profile-file-pickers]
    paths: ['.github/workflows/finish-profile-pickers.yml']
permissions:
  contents: write
concurrency:
  group: finish-profile-picker-source
  cancel-in-progress: false
jobs:
  finish:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the complete readable delta before writing any source
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, json
          changes=json.loads(r'''[{"path":"docs/file-pickers.md","before":"218ee3a59740870b17221e4620439d8cb5c051d35ed0ae9202335356671a97e1","after":"bea90119dff73cede170deba2a5f71fcad04f64297115e53ddff94f5e9509098","ops":[[2464,2464,".\nSave As retains a suggested or typed name when a folder is selected, entered with\na double-click, or opened with the primary button. The first action navigates;\nonly confirmation in the destination selects a save target. Ctrl/Command-deselect\nupdates the name from the remaining selected file; a selected path takes precedence\nover a stale display name. No deselected file is silently substituted"]]},{"path":"src/file-picker.js","before":"1bb0c91a675653c0b11718244339f66710cddf034ed393f55bd13b19dd32aee4","after":"8f9b9db74de387c8c823cc0931948edd933ce42642c748f4e04b5ee802bdbd79","ops":[[13307,13307,"&& first?.kind !== 'directory' "],[16872,16872,"// The name follows the remaining selection, not the last clicked row.\n                // A folder in Save As is navigation; keep the user's draft name.\n                "],[16881,16881," selection.size === 1 ?"],[16900,16900,"selection.has("],[16908,16908,"))"],[16909,16912,":"],[16913,16918,"null"],[16940,16940,"r?.kind === 'file' && "],[16976,16976,"M.name(r.path);\n                el"],[16978,16982," "],[16983,16990,"f"],[16991,17003,"("],[17013,17013,"open') "],[17017,17023,""],[17027,17029,".v"],[17030,17033,"lue"],[17034,17035,"="],[26481,26497,""],[26622,26622,"!"],[26637,26642,""]]},{"path":"sw.js","before":"08a4bf99b723d76851fd02ddc30d6f25bd7db7c440557805778c169439d23940","after":"1c0dbba69e2dab61656d746a3514f2f16f26e35134dd80bc084df1ab0eb7c0a5","ops":[[62,62,"-r2"]]},{"path":"tests/file-pickers/README.md","before":"97127cc914e8b336be86c8157daddf78eabde9e674dd8a3307c79b249f1fcbbc","after":"bd2318a96e2c34576901c4a3134679720ba58cbf2f0707008d81bdbf84ca126c","ops":[[2046,2046,"\n## Continuation regressions\n\nThe recovered head `6ce70f562c15655896d6a1c734bee02ad0fc3f3f` passed\n21 Chromium picker scenarios, but its reload test tried to open an unregistered\nin-memory fixture. The suite now re-registers only that descriptor after the\nfull reload. It does not reseed files, preferences, grants or application bytes.\nAll IndexedDB, expired-grant, reopen and offline assertions are retained.\n\nTwo additional browser regressions failed on the recovered production code:\nCtrl-deselecting from two files to one left the deselected filename in the input,\nand Save As discarded a draft filename on folder selection. The fixed suite\nchecks the exact remaining returned path and saves actual bytes through nested\nfolder navigation in all three desktop profiles. No forced clicks or replacement\npicker implementations are used.\n"]]},{"path":"tests/file-pickers/browser.py","before":"fdb367926e72d29a3cec2de8aa8b5a266d31d780b5780162b05be304d9a7f0ee","after":"26e7afbb5afe090060cf30ff5573ddba1fd123835f95c80ac037eb076329032e","ops":[[5334,5334,")\n            def deselect_to_one():\n                d=launch('multi');row(d,'Brief.txt').click();row(d,'bytes.bin').click(modifiers=['Control']);row(d,'Brief.txt').click(modifiers=['Control'])\n                assert row(d,'bytes.bin').get_attribute('aria-selected')=='true'\n                assert row(d,'Brief.txt').get_attribute('aria-selected')=='false'\n                assert d.get_by_label('File name',exact=True).input_value()=='bytes.bin'\n                d.get_by_role('button',name='Open',exact=True).click();assert complete()['names']==['bytes.bin']\n            check('Ctrl-deselect to one returns the remaining file, never the deselected filename',deselect_to_one)\n            def save_navigation():\n                for preset in ['windows-light','macos26-light','ubuntu-light']:\n                    js('await OS.themes.select(arg);',preset)\n                    d=launch('save');name='Preserved draft '+preset+' Ω.txt';field=d.get_by_label('File name',exact=True);field.fill(name)\n                    row(d,'Projects').click();assert field.input_value()==name\n                    d.get_by_role('button',name='Save',exact=True).click();page.wait_for_function('document.querySelector(\".io-picker-status\").textContent===\"/Documents/Picker review/Projects\"')\n                    assert field.input_value()==name\n                    assert js('return !await OS.fs.stat(\"/Documents/Picker review/\"+arg);',name)\n                    row(d,'Empty').dblclick();page.wait_for_function('document.querySelector(\".io-picker-status\").textContent.endsWith(\"/Projects/Empty\")')\n                    assert field.input_value()==name\n                    d.get_by_role('button',name='Save',exact=True).click();complete()\n                    assert js('return await OS.fs.text(await OS.fs.read(\"/Documents/Picker review/Projects/Empty/\"+arg));',name)==frame.locator('#text').input_value()\n                js('await OS.themes.select(\"windows-light\");')\n            check('Save As retains typed names while entering folders and writes only to the chosen destination',save_navigation"],[21844,21844,"# registerCustom is an in-memory test descriptor, not an app installation.\n                    # Re-register it after reload; do not reseed its stored file or preferences.\n                    "],[22265,22265,"OS.registerCustom({id:\"picker-review\",title:\"Design workspace\",path:\"/Documents/picker-review.html\"});"],[22310,22310,"\");assert(reviewWindow,\"Reload fixture registration failed"]]},{"path":"tests/file-pickers/models.cjs","before":"b5c9ed87966acaf971f0bc622b3074bfe7cc475591ae691ea8a2342c923bde53","after":"c316340235275f75c9bd9d3bc3bc756618575afccd5318e62dabe8d2b9f97b4e","ops":[[3541,3541,"\ntest('deselecting one of two files retains the other exact path',()=>{const rows=[file('a'),file('b')];assert.deepEqual([...M.select(rows,new Set(['/Documents/a','/Documents/b']),'/Documents/a','/Documents/b',{multiple:true,toggle:true})],['/Documents/b']);});\n"]]}]''')
          allowed={'docs/file-pickers.md','src/file-picker.js','sw.js','tests/file-pickers/README.md','tests/file-pickers/browser.py','tests/file-pickers/models.cjs'}
          assert len(changes)==6 and {c['path'] for c in changes}==allowed
          outputs=[]
          for c in changes:
              path=PurePosixPath(c['path']);p=Path(path)
              assert not path.is_absolute() and '..' not in path.parts and not p.is_symlink()
              before=p.read_bytes();assert hashlib.sha256(before).hexdigest()==c['before'],'Concurrent source change: '+str(p)
              text=before.decode('utf-8');last=0
              for a,b,value in c['ops']:
                  assert isinstance(a,int) and isinstance(b,int) and last<=a<=b<=len(text) and isinstance(value,str)
                  last=b
              for a,b,value in reversed(c['ops']):text=text[:a]+value+text[b:]
              result=text.encode('utf-8');assert hashlib.sha256(result).hexdigest()==c['after'],'Output mismatch: '+str(p)
              outputs.append((p,result))
          for p,result in outputs:p.write_bytes(result)
          print('All six source updates match reviewed local hashes.')
          PY
      - name: Validate source, regressions and reproducible build
        run: |
          for f in src/*.js sw.js; do node --check "$f"; done
          python3 -m py_compile tests/file-pickers/browser.py
          node --test tests/*/models.cjs tests/integrated-shell/contracts.cjs tests/web-apps/catalog.cjs
          python3 build.py
          git diff --exit-code -- sdk/aster-files.js
          git diff --check
      - name: Commit verified changes without editing workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Aster.html docs/file-pickers.md src/file-picker.js sw.js tests/file-pickers/README.md tests/file-pickers/browser.py tests/file-pickers/models.cjs
          git commit -m 'Fix exact picker selection, preserve Save As names, and repair durable reload verification'
          git push origin HEAD:feat/profile-file-pickers
