name: Audit recent web app projects
on:
  push:
    branches: [feat/start-web-apps]
    paths: ['.github/workflows/web-app-inventory.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Read public repository dates, documentation and deployed HTML
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, concurrent.futures, datetime, hashlib, html, json, os, re, urllib.request, urllib.error
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from urllib.parse import urlparse
          owner='wieslawsoltes'; zone=ZoneInfo('Europe/Warsaw')
          start=datetime.datetime(2026,9,6,tzinfo=zone)
          end=datetime.datetime(2026,9,9,tzinfo=zone)
          out=Path('/tmp/aster-web-inventory');out.mkdir()
          def api(path):
              req=urllib.request.Request('https://api.github.com/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'Aster-project-catalog'})
              with urllib.request.urlopen(req,timeout=30) as r:return json.load(r)
          repos=[]
          for page in range(1,11):
              batch=api(f'users/{owner}/repos?type=owner&sort=created&direction=desc&per_page=100&page={page}')
              for r in batch:
                  created=datetime.datetime.fromisoformat(r['created_at'].replace('Z','+00:00'))
                  if start<=created<end and not r['fork'] and not r['private']:repos.append(r)
              if len(batch)<100 or datetime.datetime.fromisoformat(batch[-1]['created_at'].replace('Z','+00:00'))<start:break
          def inspect(repo):
              keys=['name','full_name','description','created_at','updated_at','homepage','has_pages','language','default_branch','html_url','archived','fork']
              result={key:repo.get(key) for key in keys};folder=out/repo['name'];folder.mkdir()
              result['createdLocal']=datetime.datetime.fromisoformat(repo['created_at'].replace('Z','+00:00')).astimezone(zone).isoformat()
              try:
                  readme=api(f'repos/{repo["full_name"]}/readme')
                  text=base64.b64decode(readme['content']).decode('utf-8','replace')
                  (folder/'README.md').write_text(text)
                  result['readmePath']=readme['path'];result['readmeSHA']=readme['sha']
              except Exception as e: result['readmeError']=str(e)
              try:
                  root=api(f'repos/{repo["full_name"]}/contents/')
                  result['rootFiles']=[r['name'] for r in root]
              except Exception as e:result['rootError']=str(e)
              urls=[]
              homepage=repo.get('homepage') or ''
              if homepage.startswith('https://') and urlparse(homepage).hostname not in ['github.com','www.github.com']:urls.append(homepage)
              default=f'https://{owner}.github.io/{repo["name"]}/'
              if default not in urls:urls.append(default)
              result['deployments']=[]
              for i,url in enumerate(urls):
                  check={'requestedUrl':url}
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Aster-project-catalog'}),timeout=25) as response:
                          body=response.read(8*1024*1024+1)
                          check.update(status=response.status,finalUrl=response.url,headers={k.lower():v for k,v in response.headers.items() if k.lower() in ['content-type','content-security-policy','x-frame-options','permissions-policy','cross-origin-opener-policy','cross-origin-embedder-policy']},bytes=len(body),sha256=hashlib.sha256(body).hexdigest())
                      text=body.decode('utf-8','replace');title=re.search(r'<title[^>]*>(.*?)</title>',text,re.I|re.S)
                      check['title']=html.unescape(title.group(1).strip()) if title else None
                      (folder/f'deployment-{i}.html').write_text(text)
                  except urllib.error.HTTPError as e:check.update(status=e.code,error=str(e))
                  except Exception as e:check.update(error=str(e))
                  result['deployments'].append(check)
              return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:results=list(pool.map(inspect,repos))
          results.sort(key=lambda r:r['name'].lower())
          report={'owner':owner,'timezone':'Europe/Warsaw','startInclusive':start.isoformat(),'endExclusive':end.isoformat(),'auditedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'repositories':results}
          (out/'inventory.json').write_text(json.dumps(report,indent=2))
          print(json.dumps({'count':len(results),'projects':[{'name':r['name'],'created':r['createdLocal'],'pages':r['has_pages'],'deployments':r['deployments']} for r in results]},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-app-project-inventory
          path: /tmp/aster-web-inventory/
          retention-days: 14
