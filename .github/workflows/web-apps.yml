name: Categorized web apps — host and live projects
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/web-apps/**'
      - 'docs/web-app*'
      - 'Aster.html'
      - 'index.html'
      - 'build.py'
      - 'sw.js'
      - '.github/workflows/web-apps.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: web-apps-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web-apps:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate catalog, exact date coverage, URLs and standalone edition
        run: |
          for file in src/*.js sw.js; do node --check "$file"; done
          python3 build.py
          git diff --exit-code -- Aster.html
          node --test tests/web-apps/catalog.cjs
          python3 -m py_compile tests/web-apps/browser.py
          git diff --check
      - name: Install browser verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers xvfb xauth
          python3 -m pip install playwright pillow
          python3 -m playwright install --with-deps chromium
      - name: Verify host mechanics using explicit inert iframe fixtures
        run: python3 tests/web-apps/browser.py
      - name: Launch all 67 real deployed applications in Aster windows
        run: xvfb-run -a -s '-screen 0 1440x1000x24' python3 tests/web-apps/browser.py --live --gpu --headed
      - name: Retain evidence, screenshots and exact tested source
        if: always()
        run: |
          mkdir -p tests/web-apps/artifacts
          git archive --format=zip HEAD -o tests/web-apps/artifacts/source.zip
          git rev-parse HEAD > tests/web-apps/artifacts/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: categorized-web-apps-evidence
          path: |
            tests/web-apps/artifacts/
            Aster.html
          retention-days: 14
