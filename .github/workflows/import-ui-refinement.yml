name: Import verified UI refinement source
on:
  push:
    branches: [fix/theme-controls-original-icons]
    paths: ['.github/workflows/import-ui-refinement.yml']
permissions:
  contents: write
concurrency:
  group: import-ui-refinement
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the complete bounded source delta before modifying files
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, hashlib, json, lzma
          encoded=''.join(Path(f'.transfer/ui-{i}.b64').read_text().strip() for i in range(2))
          assert len(encoded)==28384
          compressed=base64.b64decode(encoded,validate=True)
          assert hashlib.sha256(compressed).hexdigest()=='be33407d1d0d4e014060768fc07cd296e4c5905f772c43e4ac057f1a1e92f5ea'
          decoder=lzma.LZMADecompressor(memlimit=128*1024*1024)
          raw=decoder.decompress(compressed,max_length=71116)
          assert decoder.eof and not decoder.unused_data and len(raw)==71115
          assert hashlib.sha256(raw).hexdigest()=='895cb5299419498c7869cd252013e335b924a9deae919a6379c71b161570ba0f'
          changes=json.loads(raw)
          allowed={'.gitignore','README.md','docs/ui-refinement.md','index.html','src/apps-files.js','src/core.js','src/profile-artwork.js','src/renderer.js','src/shell.js','src/theme-shell.js','src/ui-refinement.css','src/visual-profiles.css','src/windows.js','sw.js','tests/ui-refinement/README.md','tests/ui-refinement/browser.py','tests/ui-refinement/models.cjs'}
          assert len(changes)==17 and {c['path'] for c in changes}==allowed
          outputs=[]
          for c in changes:
              path=PurePosixPath(c['path']);p=Path(path)
              assert not path.is_absolute() and '..' not in path.parts and not p.is_symlink()
              assert p.resolve().is_relative_to(Path.cwd())
              if c['before'] is None:
                  assert not p.exists(),str(p)
                  data=c['content'].encode('utf-8')
              else:
                  before=p.read_bytes()
                  assert hashlib.sha256(before).hexdigest()==c['before'],'Concurrent change: '+str(p)
                  text=before.decode('utf-8');last=0
                  for a,b,value in c['ops']:
                      assert isinstance(a,int) and isinstance(b,int) and last<=a<=b<=len(text) and isinstance(value,str)
                      last=b
                  for a,b,value in reversed(c['ops']):text=text[:a]+value+text[b:]
                  data=text.encode('utf-8')
              assert hashlib.sha256(data).hexdigest()==c['after'],'Output mismatch: '+str(p)
              outputs.append((p,data))
          for p,data in outputs:p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          print('Verified all 17 editable source paths.')
          PY
      - name: Validate actual methods, original artwork and inherited contracts
        run: |
          for f in src/*.js src/win32/*.js sw.js; do node --check "$f"; done
          python3 -m py_compile build.py tests/ui-refinement/browser.py
          python3 build.py
          node --test tests/ui-refinement/models.cjs tests/visual-materials/models.cjs tests/themes/models.cjs tests/themes/win32.cjs tests/web-chrome/models.cjs tests/shell-launch/models.cjs tests/file-workflows/models.cjs tests/integrated-shell/contracts.cjs tests/desktop-features/models.cjs tests/web-apps/catalog.cjs
          git diff --check
      - name: Commit editable sources and remove temporary transfer parts
        run: |
          rm -rf .transfer
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Fix glass caption hit targets and add original Prism icons and window actions'
          git push origin HEAD:fix/theme-controls-original-icons
